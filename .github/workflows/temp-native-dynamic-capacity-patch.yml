name: temp-native-dynamic-capacity-patch

on:
  push:
    branches:
      - integration/v1.0-native-benchmark-matrix
    paths:
      - ".github/workflows/temp-native-dynamic-capacity-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-benchmark-matrix
      - name: Patch dynamic turn and semantic-source capacity
        shell: python
        run: |
          from pathlib import Path

          path = Path("native/mobile/memoria_mobile.c")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "#define MAX_TURNS 256\n#define MAX_EPISODES 256",
              "#define INITIAL_TURN_CAPACITY 256u\n#define MAX_EPISODES 256",
          )
          replace_once(
              "    turn_row turns[MAX_TURNS];\n    size_t turn_count;",
              "    turn_row *turns;\n    size_t turn_count;\n    size_t turn_capacity;\n    memoria_semantic_source *semantic_sources;\n    size_t semantic_capacity;",
          )
          marker = "static void free_turn(turn_row *r) { memoria_persistence_free_turn(r); }\nstatic void free_episode(episode_row *r) { memoria_persistence_free_episode(r); }\n"
          helper = marker + r'''

static int ensure_turn_capacity(memoria_mobile_handle *h, size_t needed) {
    turn_row *resized;
    size_t old_capacity, new_capacity;
    if (!h) return 0;
    if (needed <= h->turn_capacity) return 1;
    old_capacity = h->turn_capacity;
    new_capacity = old_capacity ? old_capacity : INITIAL_TURN_CAPACITY;
    while (new_capacity < needed) {
        if (new_capacity > ((size_t)-1) / 2u) { new_capacity = needed; break; }
        new_capacity *= 2u;
    }
    if (new_capacity > ((size_t)-1) / sizeof(*resized)) return 0;
    resized = (turn_row *)realloc(h->turns, new_capacity * sizeof(*resized));
    if (!resized) return 0;
    memset(resized + old_capacity, 0, (new_capacity - old_capacity) * sizeof(*resized));
    h->turns = resized;
    h->turn_capacity = new_capacity;
    return 1;
}

static int ensure_semantic_capacity(memoria_mobile_handle *h, size_t needed) {
    memoria_semantic_source *resized;
    size_t old_capacity, new_capacity;
    if (!h) return 0;
    if (needed <= h->semantic_capacity) return 1;
    old_capacity = h->semantic_capacity;
    new_capacity = old_capacity ? old_capacity : INITIAL_TURN_CAPACITY;
    while (new_capacity < needed) {
        if (new_capacity > ((size_t)-1) / 2u) { new_capacity = needed; break; }
        new_capacity *= 2u;
    }
    if (new_capacity > ((size_t)-1) / sizeof(*resized)) return 0;
    resized = (memoria_semantic_source *)realloc(h->semantic_sources, new_capacity * sizeof(*resized));
    if (!resized) return 0;
    memset(resized + old_capacity, 0, (new_capacity - old_capacity) * sizeof(*resized));
    h->semantic_sources = resized;
    h->semantic_capacity = new_capacity;
    return 1;
}
'''
          replace_once(marker, helper)
          replace_once(
              "        !memoria_persistence_meta(h->persistence, &turns, &episodes, &sequence) ||\n        turns > MAX_TURNS || episodes > MAX_EPISODES) {",
              "        !memoria_persistence_meta(h->persistence, &turns, &episodes, &sequence) ||\n        episodes > MAX_EPISODES) {",
          )
          replace_once(
              "    for (i = 0; i < turns; ++i) {\n        if (!memoria_persistence_load_turn(h->persistence, i + 1, &h->turns[i])) {",
              "    if (turns && !ensure_turn_capacity(h, turns)) {\n        memoria_mobile_close(h);\n        return MEMORIA_MOBILE_INTERNAL_ERROR;\n    }\n    for (i = 0; i < turns; ++i) {\n        if (!memoria_persistence_load_turn(h->persistence, i + 1, &h->turns[i])) {",
          )
          replace_once(
              "    if (!h || !req.data || !req.size || !out) return MEMORIA_MOBILE_INVALID_ARGUMENT;\n    if (h->turn_count >= MAX_TURNS) return unresolved(out, \"native turn capacity reached\");\n    memset(&candidate, 0, sizeof(candidate));",
              "    if (!h || !req.data || !req.size || !out) return MEMORIA_MOBILE_INVALID_ARGUMENT;\n    if (!ensure_turn_capacity(h, h->turn_count + 1u)) return MEMORIA_MOBILE_INTERNAL_ERROR;\n    memset(&candidate, 0, sizeof(candidate));",
          )
          replace_once(
              "    memoria_semantic_source sources[MAX_TURNS];",
              "    memoria_semantic_source *sources = NULL;",
          )
          replace_once(
              "    if (!query || !namespace_id) { free(query); free(namespace_id); free(json); return MEMORIA_MOBILE_INVALID_ARGUMENT; }\n    size_t source_count = 0;",
              "    if (!query || !namespace_id) { free(query); free(namespace_id); free(json); return MEMORIA_MOBILE_INVALID_ARGUMENT; }\n    if (!ensure_semantic_capacity(h, h->turn_count)) {\n        free(query); free(namespace_id); free(json);\n        return MEMORIA_MOBILE_INTERNAL_ERROR;\n    }\n    sources = h->semantic_sources;\n    size_t source_count = 0;",
          )
          replace_once(
              "    free(h->data_dir);\n    free(h->organization_id);\n    free(h);",
              "    free(h->turns);\n    free(h->semantic_sources);\n    free(h->data_dir);\n    free(h->organization_id);\n    free(h);",
          )
          path.write_text(text)

          cmake = Path("native/mobile/CMakeLists.txt")
          cmake_text = cmake.read_text()
          marker = "  add_test(NAME memoria_mobile_restart COMMAND memoria_mobile_restart)\n"
          insert = marker + "\n  add_executable(memoria_mobile_dynamic_turn_capacity tests/dynamic_turn_capacity.c)\n  target_link_libraries(memoria_mobile_dynamic_turn_capacity PRIVATE memoria_mobile)\n  target_include_directories(memoria_mobile_dynamic_turn_capacity PRIVATE ${CMAKE_CURRENT_LIST_DIR}/../../include)\n  add_test(NAME memoria_mobile_dynamic_turn_capacity COMMAND memoria_mobile_dynamic_turn_capacity)\n"
          if cmake_text.count(marker) != 1:
              raise SystemExit("restart CMake marker not unique")
          cmake.write_text(cmake_text.replace(marker, insert, 1))
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-native-dynamic-capacity-patch.yml
          git add native/mobile/memoria_mobile.c native/mobile/CMakeLists.txt native/mobile/tests/dynamic_turn_capacity.c
          git commit -m "fix(native): grow turn state beyond legacy 256 limit"
          git push origin HEAD:integration/v1.0-native-benchmark-matrix
