name: one-shot semantic source type patch
on:
  push:
    branches:
      - experiment/post-v1-native-runtime-lineage-gate
    paths:
      - tools/apply_semantic_source_type_patch.py
      - .github/workflows/one-shot-semantic-source-type.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-native-runtime-lineage-gate
      - run: python tools/apply_semantic_source_type_patch.py
      - run: |
          rm tools/apply_semantic_source_type_patch.py
          rm .github/workflows/one-shot-semantic-source-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/memoria_mobile.c tools/apply_semantic_source_type_patch.py .github/workflows/one-shot-semantic-source-type.yml
          git commit -m "fix: preserve direct semantic source type in native recall"
          git push origin HEAD:experiment/post-v1-native-runtime-lineage-gate
