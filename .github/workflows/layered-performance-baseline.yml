name: layered performance baseline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Generate layered performance baseline
        run: |
          mkdir -p benchmark-results
          python - <<'PY'
          import json, os, platform, sys
          from dataclasses import asdict
          from benchmarks.layered_resources import run_suite

          payload = {
              'schema': 'memoria.ia.layered-performance-baseline.v1',
              'commit': os.environ.get('GITHUB_SHA'),
              'runner': {
                  'os': platform.platform(),
                  'python': sys.version,
                  'machine': platform.machine(),
                  'processor': platform.processor(),
              },
              'results': [asdict(item) for item in run_suite()],
              'notes': [
                  'Timing values are runner-dependent and should be compared only with the same methodology.',
                  'Peak heap uses Python tracemalloc and is not total process RSS.',
                  'No LLM, network or external service participates in this benchmark.',
              ],
          }
          with open('benchmark-results/layered-performance-baseline-v1.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2, sort_keys=True)
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Validate baseline invariants
        run: |
          python - <<'PY'
          import json
          p = json.load(open('benchmark-results/layered-performance-baseline-v1.json', encoding='utf-8'))
          assert len(p['results']) == 3
          for row in p['results']:
              assert row['snapshots_equal'] is True
              assert row['incremental_touched'] < row['full_touched']
              assert row['peak_heap_bytes'] > 0
              assert row['build_ms'] >= 0
              assert row['incremental_ms'] >= 0
              assert row['full_ms'] >= 0
          PY
      - name: Upload layered performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: layered-performance-baseline-v1
          path: benchmark-results/layered-performance-baseline-v1.json
          if-no-files-found: error
