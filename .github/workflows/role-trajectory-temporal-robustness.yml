name: Role trajectory temporal robustness

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_trajectory_temporal_robustness.py'
      - 'src/memoria_resolutiva/trajectory_policy_gate_experimental.py'
      - 'src/memoria_resolutiva/role_structural_router_v96.py'
      - '.github/workflows/role-trajectory-temporal-robustness.yml'
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Run temporal robustness stress
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_trajectory_temporal_robustness.py | tee benchmark-results/role-trajectory-temporal-robustness.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-trajectory-temporal-robustness
          path: benchmark-results/role-trajectory-temporal-robustness.json
