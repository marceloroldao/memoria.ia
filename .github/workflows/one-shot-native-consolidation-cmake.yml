name: one-shot native consolidation cmake
on:
  push:
    branches:
      - experiment/post-v1-native-auto-consolidation
    paths:
      - tools/apply_native_consolidation_cmake.py
      - .github/workflows/one-shot-native-consolidation-cmake.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-native-auto-consolidation
      - run: python tools/apply_native_consolidation_cmake.py
      - run: |
          rm tools/apply_native_consolidation_cmake.py
          rm .github/workflows/one-shot-native-consolidation-cmake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/CMakeLists.txt tools/apply_native_consolidation_cmake.py .github/workflows/one-shot-native-consolidation-cmake.yml
          git commit -m "build: wire native semantic consolidation state"
          git push origin HEAD:experiment/post-v1-native-auto-consolidation
