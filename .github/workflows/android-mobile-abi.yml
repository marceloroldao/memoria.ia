name: Android mobile ABI

on:
  pull_request:
    branches:
      - integration/v1.0-candidate
    paths:
      - "include/memoria_mobile.h"
      - "native/mobile/**"
      - ".github/workflows/android-mobile-abi.yml"
  workflow_dispatch:

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host shim
        run: cmake -S native/mobile -B build/mobile-host -DCMAKE_BUILD_TYPE=Release
      - name: Build host shim
        run: cmake --build build/mobile-host --config Release
      - name: Run host smoke test
        run: ctest --test-dir build/mobile-host --output-on-failure

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure arm64-v8a
        run: >-
          cmake -S native/mobile -B build/mobile-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
      - name: Build arm64-v8a shared library
        run: cmake --build build/mobile-android --config Release
      - name: Verify library artifact
        run: test -f build/mobile-android/libmemoria_mobile.so
