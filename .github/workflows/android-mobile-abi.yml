name: Android mobile ABI

on:
  pull_request:
    branches:
      - integration/v1.0-candidate
    paths:
      - "include/memoria_mobile.h"
      - "native/mobile/**"
      - "tests/fixtures/native_semantic_slice1.json"
      - "tests/fixtures/native_semantic_slice2.json"
      - "tests/fixtures/native_episodic_slice3.json"
      - "tests/test_native_python_semantic_parity.py"
      - "tests/test_native_python_episodic_parity.py"
      - ".github/workflows/android-mobile-abi.yml"
  workflow_dispatch:

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resolutive-DB
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-DB
          ref: 1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e
          path: deps/resolutive-DB
      - name: Configure durable host runtime
        run: >-
          cmake -S native/mobile -B build/mobile-host
          -DCMAKE_BUILD_TYPE=Release
          -DMEMORIA_BDR_ROOT="$GITHUB_WORKSPACE/deps/resolutive-DB"
      - name: Build durable host runtime
        run: cmake --build build/mobile-host --config Release -j2
      - name: Run host semantic + restart tests
        run: ctest --test-dir build/mobile-host -R '^memoria_' --output-on-failure
      - name: Install Python parity dependencies
        run: python -m pip install -e '.[product,test]'
      - name: Compare Python and native reference vectors
        env:
          MEMORIA_NATIVE_LIB: ${{ github.workspace }}/build/mobile-host/libmemoria_mobile.so
        run: >-
          python -m pytest -q
          tests/test_native_python_semantic_parity.py
          tests/test_native_python_episodic_parity.py

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resolutive-DB
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-DB
          ref: 1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e
          path: deps/resolutive-DB
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure arm64-v8a with atomic BDR
        run: >-
          cmake -S native/mobile -B build/mobile-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
          -DMEMORIA_BDR_ROOT="$GITHUB_WORKSPACE/deps/resolutive-DB"
      - name: Build arm64-v8a shared library
        run: cmake --build build/mobile-android --target memoria_mobile --config Release -j2
      - name: Verify library artifact
        run: test -f build/mobile-android/libmemoria_mobile.so
      - name: Verify Memoria mobile ABI symbols
        run: |
          NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -g --defined-only build/mobile-android/libmemoria_mobile.so | tee memoria-mobile-symbols.txt
          grep -q "memoria_mobile_open" memoria-mobile-symbols.txt
          grep -q "memoria_mobile_learn_turn_json" memoria-mobile-symbols.txt
          grep -q "memoria_mobile_resolve_context_json" memoria-mobile-symbols.txt
          grep -q "memoria_mobile_store_episode_json" memoria-mobile-symbols.txt
          grep -q "memoria_mobile_recall_episode_json" memoria-mobile-symbols.txt
          grep -q "memoria_mobile_export_snapshot_json" memoria-mobile-symbols.txt
          grep -q "memoria_mobile_flush" memoria-mobile-symbols.txt
          grep -q "memoria_mobile_close" memoria-mobile-symbols.txt
