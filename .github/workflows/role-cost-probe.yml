name: Role relabel cost probe

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_relabel_cost_probe.py'
      - 'benchmarks/role_permutation_cost_matrix.py'
      - 'benchmarks/role_directional_relation_matrix.py'
      - 'src/memoria_resolutiva/role_structural_router_v96.py'
      - '.github/workflows/role-cost-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-cost-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Measure relabel costs
        run: python benchmarks/role_relabel_cost_probe.py
      - name: Enumerate role permutation costs
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_permutation_cost_matrix.py | tee benchmark-results/role-permutation-cost-matrix.json
      - name: Probe signed directional relation support
        run: python benchmarks/role_directional_relation_matrix.py | tee benchmark-results/role-directional-relation-matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-cost-and-direction-matrices
          path: benchmark-results/*.json
