name: Apply concept catalog enumeration patch

on:
  push:
    branches:
      - experiment/post-v1-native-concept-catalog-export

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[concept-catalog-enumeration-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-native-concept-catalog-export
          fetch-depth: 0
      - name: Add scoped enumeration contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/memoria_resolutiva/product_service.py')
          s = p.read_text()
          anchor = '''    def route_status(self, scope: MemoryScope, trajectory: Iterable[Node]):\n'''
          method = '''    def records_under(\n        self,\n        scope: MemoryScope,\n        trajectory_prefix: Iterable[Node],\n    ) -> tuple[MemoryRecord, ...]:\n        \"\"\"Enumerate active logical records beneath one scoped trajectory prefix.\n\n        This is a read-only product boundary for structured indexes such as the\n        semantic concept catalog. It never exposes the internal entry table.\n        \"\"\"\n        prefix_tail = tuple(trajectory_prefix)\n        if not prefix_tail:\n            raise ValueError(\"trajectory_prefix must not be empty\")\n        self._assert_scope(scope)\n        scope_prefix = scope.storage_namespace() + (\"memory\",)\n        logical_prefix = scope_prefix + prefix_tail\n        records: list[MemoryRecord] = []\n        for key, entry in self._entries.items():\n            if entry.revoked:\n                continue\n            try:\n                logical_route = tuple(json.loads(key))\n            except (TypeError, ValueError, json.JSONDecodeError):\n                continue\n            if logical_route[: len(logical_prefix)] != logical_prefix:\n                continue\n            if logical_route[: len(scope_prefix)] != scope_prefix:\n                continue\n            tail = logical_route[len(scope_prefix) :]\n            record = self.recall(scope, tail)\n            if record is not None:\n                records.append(record)\n        records.sort(key=lambda row: _route_key(row.trajectory))\n        return tuple(records)\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'product_service anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor, method + anchor, 1))

          p = Path('src/memoria_resolutiva/semantic_concept_store.py')
          s = p.read_text()
          anchor = '''    def resolve(\n        self,\n        scope: MemoryScope,\n'''
          method = '''    def list_concepts(\n        self,\n        scope: MemoryScope,\n        *,\n        namespace: str | None = None,\n    ) -> tuple[SemanticConcept, ...]:\n        records = self.memory.records_under(\n            scope,\n            (\"semantic-concepts\", _namespace_key(namespace), \"concept\"),\n        )\n        concepts: list[SemanticConcept] = []\n        for record in records:\n            payload = record.payload\n            if not isinstance(payload, dict) or payload.get(\"kind\") != \"semantic_concept\":\n                continue\n            concepts.append(\n                SemanticConcept(\n                    concept_id=str(payload[\"concept_id\"]),\n                    canonical_name=str(payload[\"canonical_name\"]),\n                    normalized_canonical=str(payload[\"normalized_canonical\"]),\n                    namespace=namespace,\n                    sense_key=(str(payload[\"sense_key\"]) if payload.get(\"sense_key\") else None),\n                    aliases=tuple(str(value) for value in payload.get(\"aliases\", ())),\n                    context_cues=tuple(str(value) for value in payload.get(\"context_cues\", ())),\n                )\n            )\n        concepts.sort(key=lambda concept: concept.concept_id)\n        return tuple(concepts)\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'concept store anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor, method + anchor, 1))
          PY
          rm -f .github/workflows/apply-native-concept-catalog-export.yml
          git diff --check
          git config user.name "Marcelo Roldão Matos"
          git config user.email "marceloroldao@gmail.com"
          git add -A
          git commit -m "post-v1: enumerate authoritative concept catalog [concept-catalog-enumeration-applied]"
          git push origin HEAD:experiment/post-v1-native-concept-catalog-export
