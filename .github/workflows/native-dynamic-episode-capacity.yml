name: Native dynamic episode capacity

on:
  push:
    branches: [experiment/v2-bdr-v1.2.0-rc1-validation]
    paths: ['native/mobile/memoria_mobile.c', 'native/mobile/tests/dynamic_episode_capacity.c', '.github/workflows/native-dynamic-episode-capacity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2-bdr-v1.2.0-rc1-validation

      - uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-DB
          ref: eb77ad7286f234243ca1ed1a2af2d55df8c12238
          path: resolutive-DB

      - name: Verify frozen BDR identity
        run: test "$(git -C resolutive-DB rev-parse HEAD)" = "eb77ad7286f234243ca1ed1a2af2d55df8c12238"

      - name: Verify dynamic implementation is committed
        run: |
          grep -q '#define INITIAL_EPISODE_CAPACITY 256u' native/mobile/memoria_mobile.c
          grep -q 'episode_row \*episodes;' native/mobile/memoria_mobile.c
          grep -q 'size_t episode_capacity;' native/mobile/memoria_mobile.c
          grep -q 'ensure_episode_capacity' native/mobile/memoria_mobile.c
          if grep -q '#define MAX_EPISODES 256' native/mobile/memoria_mobile.c; then
            echo 'ERROR: fixed MAX_EPISODES limit still present'
            exit 1
          fi
          if grep -q 'native episode capacity reached' native/mobile/memoria_mobile.c; then
            echo 'ERROR: legacy 256-capacity rejection still present'
            exit 1
          fi

      - name: Configure
        run: cmake -S native/mobile -B native-build -DCMAKE_BUILD_TYPE=Release -DMEMORIA_BDR_ROOT="$GITHUB_WORKSPACE/resolutive-DB"

      - name: Build
        run: cmake --build native-build --target memoria_mobile --config Release -j2

      - name: Compile regression probe
        run: cc -std=c11 -Iinclude native/mobile/tests/dynamic_episode_capacity.c -Lnative-build -lmemoria_mobile -Wl,-rpath,"$GITHUB_WORKSPACE/native-build" -o native-build/memoria_mobile_dynamic_episode_capacity

      - name: Validate 1000 episodes and cold reopen
        run: ./native-build/memoria_mobile_dynamic_episode_capacity
