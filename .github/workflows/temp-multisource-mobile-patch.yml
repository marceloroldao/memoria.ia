name: temp-multisource-mobile-patch

on:
  push:
    branches:
      - integration/v1.0-trajectory-multisource
    paths:
      - '.github/workflows/temp-multisource-mobile-patch.yml'

permissions:
  contents: write

jobs:
  patch-mobile-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/v1.0-trajectory-multisource
          fetch-depth: 0

      - name: Wire two-source trajectory JSON response
        run: python3 .github/scripts/temp_patch_multisource_mobile.py

      - name: Commit runtime wiring
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/memoria_mobile.c
          git diff --cached --check
          git commit -m "feat(mobile): materialize two-source trajectory JSON"
          git push origin HEAD:integration/v1.0-trajectory-multisource
