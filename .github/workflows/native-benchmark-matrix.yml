name: Native benchmark matrix

on:
  pull_request:
    branches:
      - integration/v1.0-candidate
    paths:
      - "native/mobile/**"
      - "benchmarks/native_server_matrix.py"
      - "benchmarks/results/native-server/**"
      - "docs/PYTHON_NATIVE_AUDIT.md"
      - ".github/workflows/native-benchmark-matrix.yml"
  workflow_dispatch:

jobs:
  native-server-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Resolutive-DB
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-DB
          ref: 1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e
          path: deps/resolutive-DB

      - name: Configure native host runtime
        run: >-
          cmake -S native/mobile -B build/mobile-host
          -DCMAKE_BUILD_TYPE=Release
          -DMEMORIA_BDR_ROOT="$GITHUB_WORKSPACE/deps/resolutive-DB"

      - name: Build native host runtime
        run: cmake --build build/mobile-host --target memoria_mobile --config Release -j2

      - name: Install benchmark runtime
        run: python -m pip install -e '.[product]'

      - name: Run 100 record benchmark
        run: >-
          python benchmarks/native_server_matrix.py
          --library "$GITHUB_WORKSPACE/build/mobile-host/libmemoria_mobile.so"
          --size 100
          --data-dir "$RUNNER_TEMP/memoria-bench-100"
          --output "$GITHUB_WORKSPACE/benchmark-results/native-100.json"

      - name: Run 1,000 record benchmark
        run: >-
          python benchmarks/native_server_matrix.py
          --library "$GITHUB_WORKSPACE/build/mobile-host/libmemoria_mobile.so"
          --size 1000
          --data-dir "$RUNNER_TEMP/memoria-bench-1000"
          --output "$GITHUB_WORKSPACE/benchmark-results/native-1000.json"

      - name: Run 10,000 record benchmark
        run: >-
          python benchmarks/native_server_matrix.py
          --library "$GITHUB_WORKSPACE/build/mobile-host/libmemoria_mobile.so"
          --size 10000
          --data-dir "$RUNNER_TEMP/memoria-bench-10000"
          --output "$GITHUB_WORKSPACE/benchmark-results/native-10000.json"

      - name: Print compact matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('benchmark-results').glob('native-*.json')):
              data = json.loads(path.read_text())
              m = data['metrics']
              print(
                  f"size={data['size']} "
                  f"ingest_p50={m['ingest_ms']['p50']}ms ingest_p95={m['ingest_ms']['p95']}ms "
                  f"resolve_p50={m['resolve_ms']['p50']}ms resolve_p95={m['resolve_ms']['p95']}ms "
                  f"rss_peak={m['rss_mib']['peak']}MiB restart={m['restart_load_ms']}ms "
                  f"context_p50={m['selected_context_bytes']['p50']}B context_p95={m['selected_context_bytes']['p95']}B"
              )
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-server-benchmark-matrix
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 30
