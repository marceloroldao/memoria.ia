name: controller transfer revocation v1.26 regression

on:
  pull_request:
    branches: [experiment/controller-transfer-quorum-v125]
  workflow_dispatch:

concurrency:
  group: controller-transfer-revocation-v126-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.25 controller transfer quorum baseline
        run: python -m pytest -q tests/test_controller_transfer_quorum_v125.py
      - name: v1.26 controller transfer revocation gate
        run: python -m pytest -q tests/test_controller_transfer_revocation_v126.py
