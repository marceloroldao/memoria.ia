name: V2 BDR v1.2.0-rc2 candidate validation

on:
  push:
    branches:
      - experiment/v2-bdr-v1.2.0-rc1-validation
    paths:
      - 'src/memoria_resolutiva/address_trajectory_v2.py'
      - 'src/memoria_resolutiva/address_trajectory_bdr_persistence.py'
      - 'src/memoria_resolutiva/bdr_atomic_bridge_v2.py'
      - 'tests/test_address_trajectory_bdr_persistence.py'
      - 'tests/test_address_trajectory_bdr_rc1_integration.py'
      - '.github/workflows/v2-bdr-v120-rc2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memoria-v2-against-rc2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Memoria.ia validation branch
        uses: actions/checkout@v4
      - name: Checkout BDR RC2 candidate branch
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-DB
          ref: release/v1.2.0-rc2
          path: bdr-source
      - name: Record candidate identity
        shell: bash
        run: |
          echo "BDR_RC2_SHA=$(git -C bdr-source rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C bdr-source log -1 --oneline
          grep -q 'BDR_ATOMIC_C_ABI_VERSION 2u' bdr-source/experimental/api_v86/include/bdr/atomic_c_api.h
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Build RC2 candidate Atomic ABI v2
        run: |
          cmake -S bdr-source/experimental/api_v86 -B bdr-build -DCMAKE_BUILD_TYPE=Release
          cmake --build bdr-build --target bdr_atomic_c_api_shared --config Release -j2
      - name: Locate built Atomic ABI v2 library
        shell: bash
        run: |
          LIB="$(find "$GITHUB_WORKSPACE/bdr-build" -type f \( -name 'libbdr_atomic_c_api_shared.so' -o -name 'libbdr_atomic_c_api.so' \) | head -n1)"
          test -n "$LIB"
          echo "MEMORIA_BDR_ATOMIC_V2_LIB=$LIB" >> "$GITHUB_ENV"
      - name: Run V2 codec contract
        run: python -m pytest -q tests/test_address_trajectory_bdr_persistence.py
      - name: Run real V2 durability and cold-restart matrix against RC2
        run: python -m pytest -q tests/test_address_trajectory_bdr_rc1_integration.py
