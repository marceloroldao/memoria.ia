name: structural inference v1.11 regression

on:
  push:
    branches:
      - experiment/structural-inference-v111
  pull_request:
    branches:
      - experiment/structural-inference-v111
  workflow_dispatch:

concurrency:
  group: structural-inference-v111-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.10 ontology-guided baseline
        run: python -m pytest -q tests/test_ontology_guided_retrieval_v110.py
      - name: v1.11 structural inference gate
        run: python -m pytest -q tests/test_structural_inference_v111.py
      - name: v1.23 guardian independence gate
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/guardian-independence-v123'
        run: python -m pytest -q tests/test_guardian_independence_v123.py
