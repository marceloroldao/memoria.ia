name: temp-native-relation-identity

on:
  push:
    branches:
      - integration/v1.0-native-relation-identity
    paths:
      - '.github/workflows/temp-native-relation-identity.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-relation-identity
      - name: Apply relation identity runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          p = Path('native/mobile/mobile_persistence_bdr.c')
          text = p.read_text()
          text = text.replace(
              '    char vals[16][VAL_CAP];\n    bdr_atomic_c_batch_result result = {0};',
              '    char vals[16][VAL_CAP];\n    char relation_ids[MEMORIA_PERSIST_MAX_RELATIONS][MEMORIA_PERSIST_MEMORY_ID_CAP];\n    bdr_atomic_c_batch_result result = {0};',
              1,
          )
          old = '''        snprintf(field,sizeof(field),"relation/%zu/object",i);
                  if (!add_put(p,ops,keys,&n,"turn",slot,field,t->relations[i].object)) return 0;
                  snprintf(vals[7+i],VAL_CAP,"%.17g",t->relations[i].confidence);
                  snprintf(field,sizeof(field),"relation/%zu/confidence",i);
                  if (!add_put(p,ops,keys,&n,"turn",slot,field,vals[7+i])) return 0;'''
          new = '''        const char *relation_id = t->relation_memory_ids[i];
                  snprintf(field,sizeof(field),"relation/%zu/object",i);
                  if (!add_put(p,ops,keys,&n,"turn",slot,field,t->relations[i].object)) return 0;
                  if (!relation_id[0]) {
                      int written = snprintf(relation_ids[i], sizeof(relation_ids[i]), "%s#relation:%zu", t->memory_id, i);
                      if (written < 0 || (size_t)written >= sizeof(relation_ids[i])) return 0;
                      relation_id = relation_ids[i];
                  }
                  snprintf(field,sizeof(field),"relation/%zu/memory_id",i);
                  if (!add_put(p,ops,keys,&n,"turn",slot,field,relation_id)) return 0;
                  snprintf(vals[7+i],VAL_CAP,"%.17g",t->relations[i].confidence);
                  snprintf(field,sizeof(field),"relation/%zu/confidence",i);
                  if (!add_put(p,ops,keys,&n,"turn",slot,field,vals[7+i])) return 0;'''
          if old not in text:
              raise SystemExit('save relation anchor not found')
          text = text.replace(old, new, 1)
          old = '''        snprintf(field,sizeof(field),"relation/%zu/confidence",i);
                  if(!fetch(p,"turn",slot,field,&v)||!v||!parse_d(v,&t->relations[i].confidence)) goto fail;
                  free(v); v=NULL;'''
          new = '''        snprintf(field,sizeof(field),"relation/%zu/confidence",i);
                  if(!fetch(p,"turn",slot,field,&v)||!v||!parse_d(v,&t->relations[i].confidence)) goto fail;
                  free(v); v=NULL;
                  snprintf(field,sizeof(field),"relation/%zu/memory_id",i);
                  if(!fetch(p,"turn",slot,field,&v)) goto fail;
                  if (v && *v) {
                      if (strlen(v) >= sizeof(t->relation_memory_ids[i])) goto fail;
                      snprintf(t->relation_memory_ids[i], sizeof(t->relation_memory_ids[i]), "%s", v);
                      free(v); v=NULL;
                  } else {
                      int written;
                      free(v); v=NULL;
                      written = snprintf(t->relation_memory_ids[i], sizeof(t->relation_memory_ids[i]), "%s#relation:%zu", t->memory_id, i);
                      if (written < 0 || (size_t)written >= sizeof(t->relation_memory_ids[i])) goto fail;
                  }'''
          if old not in text:
              raise SystemExit('load relation anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('native/mobile/memoria_mobile.c')
          text = p.read_text().replace('1536', '4096')
          anchor = '''static turn_row *find_turn(memoria_mobile_handle *h, const char *memory_id) {
              size_t i;
              if (!h || !memory_id) return NULL;
              for (i = 0; i < h->turn_count; ++i) if (h->turns[i].memory_id && strcmp(h->turns[i].memory_id, memory_id) == 0) return &h->turns[i];
              return NULL;
          }
          '''
          helper = anchor + '''
          static int turn_relations_to_json(const turn_row *turn, char *out, size_t out_size) {
              const char *ids[MAX_RELATIONS_PER_TURN];
              size_t i;
              if (!turn) return 0;
              for (i = 0; i < turn->relation_count; ++i) ids[i] = turn->relation_memory_ids[i];
              return memoria_relations_to_json_with_ids(
                  turn->relations, ids, turn->relation_count, turn->memory_id, out, out_size
              );
          }
          '''
          if anchor not in text:
              raise SystemExit('find_turn anchor not found')
          text = text.replace(anchor, helper, 1)

          text = text.replace(
              '    char *corrections[MAX_CORRECTIONS] = {0};\n    size_t correction_slots[MAX_CORRECTIONS] = {0};',
              '    char *corrections[MAX_CORRECTIONS] = {0};\n    char *relation_ids[MAX_RELATIONS_PER_TURN] = {0};\n    const char *relation_id_ptrs[MAX_RELATIONS_PER_TURN] = {0};\n    size_t correction_slots[MAX_CORRECTIONS] = {0};',
              1,
          )
          text = text.replace(
              '    size_t correction_count = 0, i, unique_count = 0;',
              '    size_t correction_count = 0, relation_id_count = 0, i, unique_count = 0;\n    int relation_ids_present = 0;',
              1,
          )
          old = '''    candidate.relation_count = memoria_extract_relations(text, candidate.relations, MAX_RELATIONS_PER_TURN);
              if (!memoria_relations_to_json(candidate.relations, candidate.relation_count, id, relations_json, sizeof(relations_json))) {
                  free_string_array(corrections, correction_count);
                  free(json); free_turn(&candidate); return MEMORIA_MOBILE_INTERNAL_ERROR;
              }'''
          new = '''    candidate.relation_count = memoria_extract_relations(text, candidate.relations, MAX_RELATIONS_PER_TURN);
              relation_ids_present = strstr(json, "\\\"relation_memory_ids\\\"") != NULL;
              if (relation_ids_present)
                  relation_id_count = json_string_array(json, "relation_memory_ids", relation_ids, MAX_RELATIONS_PER_TURN);
              if (relation_ids_present && relation_id_count != candidate.relation_count) {
                  free_string_array(relation_ids, relation_id_count);
                  free_string_array(corrections, correction_count);
                  free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;
              }
              for (i = 0; i < candidate.relation_count; ++i) {
                  int written;
                  if (relation_ids_present) {
                      if (!relation_ids[i] || !relation_ids[i][0] || strlen(relation_ids[i]) >= sizeof(candidate.relation_memory_ids[i])) {
                          free_string_array(relation_ids, relation_id_count);
                          free_string_array(corrections, correction_count);
                          free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;
                      }
                      snprintf(candidate.relation_memory_ids[i], sizeof(candidate.relation_memory_ids[i]), "%s", relation_ids[i]);
                  } else {
                      written = snprintf(candidate.relation_memory_ids[i], sizeof(candidate.relation_memory_ids[i]), "%s#relation:%zu", id, i);
                      if (written < 0 || (size_t)written >= sizeof(candidate.relation_memory_ids[i])) {
                          free_string_array(corrections, correction_count);
                          free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;
                      }
                  }
                  relation_id_ptrs[i] = candidate.relation_memory_ids[i];
              }
              if (!memoria_relations_to_json_with_ids(candidate.relations, relation_id_ptrs, candidate.relation_count, id, relations_json, sizeof(relations_json))) {
                  free_string_array(relation_ids, relation_id_count);
                  free_string_array(corrections, correction_count);
                  free(json); free_turn(&candidate); return MEMORIA_MOBILE_INTERNAL_ERROR;
              }'''
          if old not in text:
              raise SystemExit('learn relation anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''        free_string_array(corrections, correction_count);
                  free(json); free_turn(&candidate); return MEMORIA_MOBILE_PERSISTENCE_ERROR;
              }''',
              '''        free_string_array(relation_ids, relation_id_count);
                  free_string_array(corrections, correction_count);
                  free(json); free_turn(&candidate); return MEMORIA_MOBILE_PERSISTENCE_ERROR;
              }''',
              1,
          )
          text = text.replace(
              '''    free_string_array(corrections, correction_count);
              free(json);
              return response_status;
          }

          memoria_mobile_status memoria_mobile_resolve_context_json''',
              '''    free_string_array(relation_ids, relation_id_count);
              free_string_array(corrections, correction_count);
              free(json);
              return response_status;
          }

          memoria_mobile_status memoria_mobile_resolve_context_json''',
              1,
          )

          text = text.replace(
              '''memoria_relations_to_json(current_turn->relations, current_turn->relation_count,
                                             current_turn->memory_id, relations_json, sizeof(relations_json))''',
              '''turn_relations_to_json(current_turn, relations_json, sizeof(relations_json))'''
          )
          text = text.replace(
              '''memoria_relations_to_json(first_turn->relations, first_turn->relation_count,
                                             first_turn->memory_id, first_relations, sizeof(first_relations))''',
              '''turn_relations_to_json(first_turn, first_relations, sizeof(first_relations))'''
          )
          text = text.replace(
              '''memoria_relations_to_json(second_turn->relations, second_turn->relation_count,
                                             second_turn->memory_id, second_relations, sizeof(second_relations))''',
              '''turn_relations_to_json(second_turn, second_relations, sizeof(second_relations))'''
          )
          text = text.replace(
              '''memoria_relations_to_json(h->turns[i].relations, h->turns[i].relation_count,
                                             h->turns[i].memory_id, relations_json, sizeof(relations_json))''',
              '''turn_relations_to_json(&h->turns[i], relations_json, sizeof(relations_json))'''
          )
          p.write_text(text)

          p = Path('native/mobile/diagnostic_export.c')
          text = p.read_text()
          old = '''static int append_relation(json_builder *b, const memoria_relation *r, const char *memory_id) {
              if (!append(b, "{\\\"subject\\\":")) return 0;
              if (!append_json_string(b, r->subject)) return 0;
              if (!append(b, ",\\\"predicate\\\":")) return 0;
              if (!append_json_string(b, r->predicate)) return 0;
              if (!append(b, ",\\\"object\\\":")) return 0;
              if (!append_json_string(b, r->object)) return 0;
              if (!appendf(b, ",\\\"confidence\\\":%.6f,\\\"source_memory_id\\\":", r->confidence)) return 0;
              if (!append_json_string(b, memory_id)) return 0;
              return append(b, "}");
          }'''
          new = '''static int append_relation(json_builder *b, const memoria_relation *r, const char *relation_memory_id, const char *source_memory_id) {
              if (!append(b, "{\\\"subject\\\":")) return 0;
              if (!append_json_string(b, r->subject)) return 0;
              if (!append(b, ",\\\"predicate\\\":")) return 0;
              if (!append_json_string(b, r->predicate)) return 0;
              if (!append(b, ",\\\"object\\\":")) return 0;
              if (!append_json_string(b, r->object)) return 0;
              if (!append(b, ",\\\"memory_id\\\":")) return 0;
              if (!append_json_string(b, relation_memory_id)) return 0;
              if (!appendf(b, ",\\\"confidence\\\":%.6f,\\\"source_memory_id\\\":", r->confidence)) return 0;
              if (!append_json_string(b, source_memory_id)) return 0;
              return append(b, "}");
          }'''
          if old not in text:
              raise SystemExit('diagnostic append_relation anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        if (!append_relation(b, &t->relations[i], t->memory_id)) return 0;',
              '        if (!append_relation(b, &t->relations[i], t->relation_memory_ids[i], t->memory_id)) return 0;',
              1,
          )
          p.write_text(text)
          PY
      - name: Remove one-shot workflow and commit runtime patch
        shell: bash
        run: |
          rm .github/workflows/temp-native-relation-identity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/mobile/mobile_persistence_bdr.c native/mobile/memoria_mobile.c native/mobile/diagnostic_export.c .github/workflows/temp-native-relation-identity.yml
          git commit -m 'feat(native): persist stable relation identities'
          git push origin HEAD:integration/v1.0-native-relation-identity
