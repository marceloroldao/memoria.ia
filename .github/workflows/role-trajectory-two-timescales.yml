name: Role trajectory dual temporal scales

on:
  push:
    branches:
      - experiment/bdr-primary-linux
    paths:
      - 'benchmarks/role_trajectory_two_timescales.py'
      - 'benchmarks/role_trajectory_slot_support.py'
      - 'benchmarks/role_trajectory_partial_drift.py'
      - 'src/memoria_resolutiva/trajectory_policy_gate_experimental.py'
      - '.github/workflows/role-trajectory-two-timescales.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Run dual temporal scale probe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          PYTHONPATH=.:src python benchmarks/role_trajectory_two_timescales.py | tee benchmark-results/role-trajectory-two-timescales.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-trajectory-two-timescales
          path: benchmark-results/role-trajectory-two-timescales.json
