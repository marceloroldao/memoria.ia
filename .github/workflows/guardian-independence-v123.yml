name: guardian independence v1.23 regression

on:
  push:
    branches:
      - experiment/guardian-independence-v123
  pull_request:
    branches:
      - experiment/structural-inference-v111

jobs:
  regression:
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.22 recovery quorum baseline
        run: python -m pytest -q tests/test_recovery_quorum_v122.py
      - name: v1.23 guardian independence gate
        run: python -m pytest -q tests/test_guardian_independence_v123.py

# The structural experimental base also carries a PR-level v1.23 gate so
# GitHub evaluates this branch even when newly-added head workflows are not run.
