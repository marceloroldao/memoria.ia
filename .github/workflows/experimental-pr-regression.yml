name: experimental PR regression

on:
  pull_request:
    branches:
      - main
      - freeze/topological-temporal-v1
      - freeze/topological-temporal-v1-integration-qualified
      - freeze/topological-conversation-runtime-v1-integration-qualified
      - freeze/mobile-cognitive-packet-v1-integration-qualified
      - freeze/mobile-response-validator-v1-integration-qualified
      - freeze/mobile-learning-gate-v1-integration-qualified
      - freeze/mobile-repeated-collection-recall-v1-integration-qualified
  workflow_dispatch:

concurrency:
  group: experimental-pr-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'experiment/') || startsWith(github.head_ref, 'post-freeze/')
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: V2 recovery-after-exhaustion scaling evidence
        if: runner.os == 'Linux'
        run: python benchmarks/recovery_after_exhaustion_v2_benchmark.py | tee recovery-after-exhaustion-v2-benchmark.json
      - name: V2 adversarial hierarchy and hub evidence
        if: runner.os == 'Linux'
        run: python benchmarks/adversarial_structure_v2_benchmark.py | tee adversarial-structure-v2-benchmark.json
      - name: V2 adversarial corpus evidence
        if: runner.os == 'Linux'
        run: python benchmarks/adversarial_corpus_v2_benchmark.py | tee adversarial-corpus-v2-benchmark.json
      - name: V2 probe of frozen restart3 shared fixture
        if: runner.os == 'Linux'
        run: python benchmarks/v2_restart3_shared_fixture.py | tee v2-restart3-shared-fixture.json
      - name: V2 structural equivalence state evidence
        if: runner.os == 'Linux'
        run: python benchmarks/structural_equivalence_state_v2_benchmark.py | tee structural-equivalence-state-v2-benchmark.json
      - name: V2 automatic structural witness discovery evidence
        if: runner.os == 'Linux'
        run: python benchmarks/structural_witness_discovery_v2_benchmark.py | tee structural-witness-discovery-v2-benchmark.json
      - name: V2 structural role abstraction evidence
        if: runner.os == 'Linux'
        run: python benchmarks/structural_role_abstraction_v2_benchmark.py | tee structural-role-abstraction-v2-benchmark.json
      - name: Upload V2 recovery evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: recovery-after-exhaustion-v2-benchmark
          path: recovery-after-exhaustion-v2-benchmark.json
      - name: Upload V2 adversarial structure evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-structure-v2-benchmark
          path: adversarial-structure-v2-benchmark.json
      - name: Upload V2 adversarial corpus evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-corpus-v2-benchmark
          path: adversarial-corpus-v2-benchmark.json
      - name: Upload V2 versus restart3 shared fixture evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-restart3-shared-fixture
          path: v2-restart3-shared-fixture.json
      - name: Upload V2 structural equivalence state evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: structural-equivalence-state-v2-benchmark
          path: structural-equivalence-state-v2-benchmark.json
      - name: Upload V2 structural witness discovery evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: structural-witness-discovery-v2-benchmark
          path: structural-witness-discovery-v2-benchmark.json
      - name: Upload V2 structural role abstraction evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: structural-role-abstraction-v2-benchmark
          path: structural-role-abstraction-v2-benchmark.json

  restart3-frozen-reference:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'experiment/') || startsWith(github.head_ref, 'post-freeze/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualified restart3 baseline
        uses: actions/checkout@v4
        with:
          ref: 5fa39ea39ce9d09518e8b726f6297bf8db02ef1c
      - name: Checkout restart3 pinned Resolutive-DB
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-DB
          ref: 1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e
          path: deps/resolutive-DB
      - name: Configure exact restart3 mobile runtime
        run: >-
          cmake -S native/mobile -B build/restart3-reference
          -DCMAKE_BUILD_TYPE=Release
          -DMEMORIA_BDR_ROOT="$GITHUB_WORKSPACE/deps/resolutive-DB"
      - name: Build exact restart3 mobile reference
        run: cmake --build build/restart3-reference --target memoria_mobile_restart --config Release -j2
      - name: Run exact restart3 repeated collection/restart acceptance
        run: ctest --test-dir build/restart3-reference -R '^memoria_mobile_restart$' --output-on-failure
      - name: Record immutable reference metadata
        run: |
          printf '%s\n' '{"schema":"memoria.restart3.frozen-reference.1","memoria_sha":"5fa39ea39ce9d09518e8b726f6297bf8db02ef1c","bdr_sha":"1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e","fixture":"native/mobile/tests/restart.c","qualified":true}' > restart3-frozen-reference.json
      - name: Upload frozen restart3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: restart3-frozen-reference
          path: restart3-frozen-reference.json

  bdr-topological-parity:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'experiment/') || startsWith(github.head_ref, 'post-freeze/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Memoria.ia experiment
        uses: actions/checkout@v4
      - name: Checkout experimental Resolutive-DB bridge
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-DB
          ref: experiment/python-atomic-bridge
          path: bdr-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pybind11
      - name: Build BDR shared and native-link artifacts
        run: |
          cmake -S bdr-source/experimental/api_v86 -B bdr-build -DCMAKE_BUILD_TYPE=Release
          cmake --build bdr-build --target bdr_atomic_c_api_shared bdr_v1_candidate --config Release -j2
          test -f bdr-build/libbdr_atomic_c_api.so
          test -f bdr-build/libbdr.a
      - name: Install Memoria.ia with native BDR extension
        env:
          MEMORIA_BUILD_BDR: '1'
          BDR_INCLUDE_DIR: ${{ github.workspace }}/bdr-source/experimental/api_v86/include
          BDR_LIBRARY_FILE: ${{ github.workspace }}/bdr-build/libbdr.a
        run: python -m pip install -e '.[product,test]' --no-build-isolation
      - name: Verify both BDR bindings are active
        env:
          BDR_ATOMIC_LIB: ${{ github.workspace }}/bdr-build/libbdr_atomic_c_api.so
        run: |
          python - <<'PY'
          import os
          from memoria_resolutiva.bdr_store import native_bdr_available
          assert native_bdr_available(), 'native EvidenceCore BDR extension is unavailable'
          assert os.path.isfile(os.environ['BDR_ATOMIC_LIB'])
          print('native EvidenceCore BDR + shared atomic BDR available')
          PY
      - name: Run real BDR runtime, topology, EvidenceCore and epistemic cold restart fixtures
        env:
          BDR_ATOMIC_LIB: ${{ github.workspace }}/bdr-build/libbdr_atomic_c_api.so
        run: python -m pytest -q tests/test_evidence_state_v1_candidate.py tests/test_topological_bdr_persistence.py tests/test_epistemic_bdr_persistence.py tests/test_cognitive_cycle_restart.py tests/test_topological_conversation_runtime.py tests/test_topological_runtime_persistence.py
      - name: Record BDR versus SQLite latency and growth evidence
        env:
          BDR_ATOMIC_LIB: ${{ github.workspace }}/bdr-build/libbdr_atomic_c_api.so
        run: python benchmarks/topological_persistence_benchmark.py | tee topological-persistence-benchmark.json
      - name: Record multi-size scaling evidence
        env:
          BDR_ATOMIC_LIB: ${{ github.workspace }}/bdr-build/libbdr_atomic_c_api.so
        run: python benchmarks/topological_multisize_benchmark.py | tee topological-multisize-benchmark.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: topological-persistence-benchmark
          path: |
            topological-persistence-benchmark.json
            topological-multisize-benchmark.json
