name: Post-v1 Retrieval v2 semantic adapter

on:
  push:
    branches:
      - experiment/post-v1-retrieval-v2-semantic-adapter
  pull_request:
    branches:
      - post-v1/core-base

jobs:
  semantic-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Retrieval v2 semantic adapter test
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            native/mobile/tests/retrieval_v2_semantic_adapter.c \
            native/mobile/retrieval_v2_semantic_adapter.c \
            native/mobile/retrieval_v2_normalization.c \
            native/mobile/semantic_kernel.c \
            -Inative/mobile -lm \
            -o /tmp/retrieval_v2_semantic_adapter_test
      - name: Run Retrieval v2 semantic adapter test
        run: /tmp/retrieval_v2_semantic_adapter_test
