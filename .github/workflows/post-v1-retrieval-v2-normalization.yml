name: Post-v1 Retrieval v2 normalization

on:
  push:
    branches:
      - experiment/post-v1-retrieval-v2-morphology
  pull_request:
    paths:
      - 'native/mobile/retrieval_v2_normalization.c'
      - 'native/mobile/retrieval_v2_normalization.h'
      - 'native/mobile/tests/retrieval_v2_normalization.c'
      - '.github/workflows/post-v1-retrieval-v2-normalization.yml'

jobs:
  normalization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build normalization test
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Inative/mobile \
            native/mobile/tests/retrieval_v2_normalization.c \
            native/mobile/retrieval_v2_normalization.c \
            -o /tmp/memoria-retrieval-v2-normalization
      - name: Run normalization test
        run: /tmp/memoria-retrieval-v2-normalization
