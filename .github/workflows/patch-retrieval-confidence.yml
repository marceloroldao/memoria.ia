name: patch-retrieval-confidence
on:
  push:
    branches: [experiment/post-v1-subconscious-retrieval-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-subconscious-retrieval-v2
          fetch-depth: 0
      - name: Apply confidence parity patch
        run: python tools/patch_retrieval_confidence.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/mobile/semantic_kernel.c
          git commit -m "fix(retrieval): preserve confidence parity contract"
          git push origin HEAD:experiment/post-v1-subconscious-retrieval-v2
