name: live Gemini provider validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify secret is configured
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'GEMINI_API_KEY repository secret is not configured.'
            exit 1
          fi
      - name: Install product dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product]'
      - name: Run one live Gemini call through Memoria.ia
        run: python experiments/live_gemini_validation.py
      - name: Upload sanitized validation report
        uses: actions/upload-artifact@v4
        with:
          name: live-gemini-validation
          path: benchmark-results/live-gemini-v1.json
          if-no-files-found: error
          retention-days: 30
