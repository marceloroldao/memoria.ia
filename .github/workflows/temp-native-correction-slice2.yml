name: temp-native-correction-slice2

on:
  push:
    branches:
      - integration/v1.0-native-parity-slice2
    paths:
      - '.github/workflows/temp-native-correction-slice2.yml'
      - '.github/scripts/temp_patch_native_correction_slice2.py'
      - '.github/scripts/temp_patch_native_correction_lineage.py'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-parity-slice2
      - name: Apply native correction patches
        run: |
          python .github/scripts/temp_patch_native_correction_slice2.py
          python .github/scripts/temp_patch_native_correction_lineage.py
      - name: Commit permanent runtime changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/mobile_persistence.h native/mobile/mobile_persistence_bdr.c native/mobile/memoria_mobile.c native/mobile/diagnostic_export.c
          git diff --cached --check
          git commit -m "feat(native): persist correction supersession semantics"
          git push origin HEAD:integration/v1.0-native-parity-slice2
