name: controller transfer v1.24 regression

on:
  push:
    branches:
      - experiment/controller-transfer-v124
  pull_request:
    branches:
      - experiment/structural-inference-v111

jobs:
  regression:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.23 guardian independence baseline
        run: python -m pytest -q tests/test_guardian_independence_v123.py
      - name: v1.24 controller transfer gate
        run: python -m pytest -q tests/test_controller_transfer_v124.py
