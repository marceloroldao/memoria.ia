name: conflict aware v1.12 regression

on:
  push:
    branches:
      - experiment/conflict-aware-inference-v112
  workflow_dispatch:

concurrency:
  group: conflict-aware-v112-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.11 structural inference baseline
        run: python -m pytest -q tests/test_structural_inference_v111.py
      - name: v1.12 conflict-aware inference gate
        run: python -m pytest -q tests/test_conflict_aware_inference_v112.py
