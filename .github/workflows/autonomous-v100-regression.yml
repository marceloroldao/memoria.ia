name: autonomous v1.00 certified postings regression

on:
  push:
    branches:
      - experiment/core-autonomous-v100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v0.99 baseline gate
        run: python -m pytest -q tests/test_autonomous_memory_v099.py tests/test_product_chat_autonomous_v099.py tests/test_autonomous_upgrade_v099.py
      - name: v1.00 certified postings gate
        run: python -m pytest -q tests/test_autonomous_memory_v100.py tests/test_autonomous_memory_v100_adversarial.py
      - name: v0.98 vs v0.99 vs v1.00 scaling benchmark
        run: python experiments/autonomous_v100_scaling.py
      - name: v1.00 selectivity benchmark
        run: python experiments/autonomous_v100_selectivity.py
