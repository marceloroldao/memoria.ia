name: patch-external-json-escapes
on:
  push:
    branches: [fix/post-v1-external-json-escapes]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-v1-external-json-escapes
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_external_json_escapes.py
      - name: Commit clean patch
        run: |
          rm tools/patch_external_json_escapes.py .github/workflows/patch-external-json-escapes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/mobile/memoria_mobile_post_v1.c native/mobile/tests/external_public_knowledge_mobile.c tools/patch_external_json_escapes.py .github/workflows/patch-external-json-escapes.yml
          git commit -m "fix(mobile): decode escaped external knowledge JSON"
          git push origin HEAD:fix/post-v1-external-json-escapes
