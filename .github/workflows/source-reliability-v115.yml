name: source reliability v1.15 regression

on:
  push:
    branches:
      - experiment/source-reliability-v115
  workflow_dispatch:

concurrency:
  group: source-reliability-v115-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.14 independent corroboration baseline
        run: python -m pytest -q tests/test_independent_corroboration_v114.py tests/test_provenance_confidence_v113.py tests/test_temporal_structural_inference_v112.py
      - name: v1.15 source reliability gate
        run: python -m pytest -q tests/test_source_reliability_v115.py tests/test_source_reliability_v23.py
