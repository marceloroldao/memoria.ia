name: abstraction relations v1.08 regression

on:
  push:
    branches:
      - experiment/abstraction-relations-v108
  workflow_dispatch:

concurrency:
  group: abstraction-relations-v108-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.07 abstraction baseline
        run: python -m pytest -q tests/test_abstractions_v107.py
      - name: v1.08 abstraction relation gate
        run: python -m pytest -q tests/test_abstraction_relations_v108.py
