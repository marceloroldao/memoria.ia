name: temp-freeze-conversation-response

on:
  pull_request:
    branches:
      - integration/v1.0-candidate

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'integration/v1.0-native-confidence-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Freeze native response metadata and confidence
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Native C: expose already-persisted created order/time in generic resolve provenance.
          replace_once(
              'native/mobile/memoria_mobile.c',
              '    char *json, *query, *namespace_id, *ctx, *st, *root;\n',
              '    char *json, *query, *namespace_id, *ctx, *st, *root, *created_time;\n',
          )
          replace_once(
              'native/mobile/memoria_mobile.c',
              '''    ctx = json_escape(h->turns[i].text);\n    st = json_escape(r.source_type ? r.source_type : "");\n    root = json_escape(r.ultimate_source_memory_id ? r.ultimate_source_memory_id : "");\n    if (!ctx || !st || !root) { free(ctx); free(st); free(root); return MEMORIA_MOBILE_INTERNAL_ERROR; }\n    response_status = set_responsef(out, MEMORIA_MOBILE_OK,\n             "{\\\"status\\\":\\\"HIT\\\",\\\"confidence\\\":%.6f,\\\"memory_ids\\\":[\\\"%s\\\"],\\\"selected_context\\\":\\\"%s\\\",\\\"relations\\\":%s,\\\"trajectory_used\\\":%s,\\\"conversation_window_count\\\":%lu,\\\"temporal_state_used\\\":false,\\\"provenance\\\":[{\\\"memory_id\\\":\\\"%s\\\",\\\"source_type\\\":\\\"%s\\\",\\\"source_authority\\\":%.6f,\\\"ultimate_source_memory_id\\\":\\\"%s\\\"}]}\",\n             r.confidence, r.memory_id, ctx, relations_json,\n             trajectory_mode == 1 && tr.used_window ? "true" : "false",\n             (unsigned long)(trajectory_mode == 1 ? window_count : 0),\n             r.memory_id, st, r.source_authority, root);\n    free(ctx); free(st); free(root);\n''',
              '''    ctx = json_escape(h->turns[i].text);\n    st = json_escape(r.source_type ? r.source_type : "");\n    root = json_escape(r.ultimate_source_memory_id ? r.ultimate_source_memory_id : "");\n    created_time = json_escape(h->turns[i].created_time);\n    if (!ctx || !st || !root || !created_time) { free(ctx); free(st); free(root); free(created_time); return MEMORIA_MOBILE_INTERNAL_ERROR; }\n    response_status = set_responsef(out, MEMORIA_MOBILE_OK,\n             "{\\\"status\\\":\\\"HIT\\\",\\\"confidence\\\":%.6f,\\\"memory_ids\\\":[\\\"%s\\\"],\\\"selected_context\\\":\\\"%s\\\",\\\"relations\\\":%s,\\\"trajectory_used\\\":%s,\\\"conversation_window_count\\\":%lu,\\\"temporal_state_used\\\":false,\\\"provenance\\\":[{\\\"memory_id\\\":\\\"%s\\\",\\\"source_type\\\":\\\"%s\\\",\\\"source_authority\\\":%.6f,\\\"ultimate_source_memory_id\\\":\\\"%s\\\",\\\"created_order\\\":%ld,\\\"created_time\\\":\\\"%s\\\"}]}\",\n             r.confidence, r.memory_id, ctx, relations_json,\n             trajectory_mode == 1 && tr.used_window ? "true" : "false",\n             (unsigned long)(trajectory_mode == 1 ? window_count : 0),\n             r.memory_id, st, r.source_authority, root, h->turns[i].order, created_time);\n    free(ctx); free(st); free(root); free(created_time);\n''',
          )

          # Thin adapter: relation epoch is metadata copied from native provenance, never reranked.
          replace_once(
              'src/memoria_resolutiva/native_conversation.py',
              '''        for row in raw_provenance:\n            if not isinstance(row, dict):\n                raise RuntimeError("native conversation resolve returned invalid provenance row")\n            source_type = str(row.get("source_type") or "")\n            provenance_rows.append({\n                "memory_id": str(row.get("memory_id") or ""),\n                "source_type": source_type,\n                "source_authority": float(row.get("source_authority", 0.0)),\n                "immediate_source_type": str(row.get("immediate_source_type") or source_type),\n                "parent_memory_ids": list(row.get("parent_memory_ids") or []),\n                "ultimate_source_memory_id": str(row.get("ultimate_source_memory_id") or row.get("memory_id") or ""),\n                "created_order": row.get("created_order"),\n                "created_time": row.get("created_time"),\n                "superseded_by": row.get("superseded_by"),\n            })\n\n        # The native resolver ranks authoritative turns. The historic product API,\n''',
              '''        for row in raw_provenance:\n            if not isinstance(row, dict):\n                raise RuntimeError("native conversation resolve returned invalid provenance row")\n            source_type = str(row.get("source_type") or "")\n            provenance_rows.append({\n                "memory_id": str(row.get("memory_id") or ""),\n                "source_type": source_type,\n                "source_authority": float(row.get("source_authority", 0.0)),\n                "immediate_source_type": str(row.get("immediate_source_type") or source_type),\n                "parent_memory_ids": list(row.get("parent_memory_ids") or []),\n                "ultimate_source_memory_id": str(row.get("ultimate_source_memory_id") or row.get("memory_id") or ""),\n                "created_order": row.get("created_order"),\n                "created_time": row.get("created_time"),\n                "superseded_by": row.get("superseded_by"),\n            })\n\n        if len(provenance_rows) == 1 and provenance_rows[0].get("created_order") is not None:\n            relation_order = provenance_rows[0]["created_order"]\n            relations = tuple({**row, "epoch": relation_order} for row in relations)\n\n        # The native resolver ranks authoritative turns. The historic product API,\n''',
          )

          # Legacy Python reference: keep selection unchanged; align public confidence to native authority.
          replace_once(
              'src/memoria_resolutiva/product_conversation.py',
              '''    def _ultimate_source_ids(self, scored: list[tuple[float, int, EvidenceEdge]], *, namespace: str | None) -> set[str]:\n        roots: set[str] = set()\n        for _score, _order, edge in scored:\n            source = self.provenance.active_ultimate_source(edge.evidence_id, namespace=namespace)\n            if source is not None:\n                roots.add(source.memory_id)\n        return roots\n\n    def resolve(self, *, query: str, session_id: str | None = None) -> ConversationResolveResult:\n''',
              '''    def _ultimate_source_ids(self, scored: list[tuple[float, int, EvidenceEdge]], *, namespace: str | None) -> set[str]:\n        roots: set[str] = set()\n        for _score, _order, edge in scored:\n            source = self.provenance.active_ultimate_source(edge.evidence_id, namespace=namespace)\n            if source is not None:\n                roots.add(source.memory_id)\n        return roots\n\n    def _native_reference_confidence(self, *, qtokens: set[str], edge: EvidenceEdge, namespace: str | None) -> float:\n        overlap = len(qtokens & _tokens(edge.source_text)) / max(1, len(qtokens))\n        source = self.provenance.active_ultimate_source(edge.evidence_id, namespace=namespace)\n        authority = 0.0 if source is None else max(0.0, min(1.0, float(source.authority)))\n        return min(0.8, 0.30 + 0.25 * overlap + 0.25 * authority)\n\n    def resolve(self, *, query: str, session_id: str | None = None) -> ConversationResolveResult:\n''',
          )
          replace_once(
              'src/memoria_resolutiva/product_conversation.py',
              '''        if selected is not None:\n            relevance, edge = selected\n            return self._result("HIT", [edge], confidence=min(1.0, 0.65 + 0.15 * relevance), namespace=session_id)\n''',
              '''        if selected is not None:\n            _relevance, edge = selected\n            return self._result(\n                "HIT", [edge],\n                confidence=self._native_reference_confidence(qtokens=qtokens, edge=edge, namespace=session_id),\n                namespace=session_id,\n            )\n''',
          )
          replace_once(
              'src/memoria_resolutiva/product_conversation.py',
              '''        score, edge = selected\n        return self._result("HIT", [edge], confidence=min(0.8, 0.45 + 0.35 * score), namespace=session_id)\n''',
              '''        _score, edge = selected\n        return self._result(\n            "HIT", [edge],\n            confidence=self._native_reference_confidence(qtokens=qtokens, edge=edge, namespace=session_id),\n            namespace=session_id,\n        )\n''',
          )

          Path('.github/workflows/temp-freeze-conversation-response.yml').unlink()
      - name: Commit response contract patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/memoria_mobile.c src/memoria_resolutiva/native_conversation.py src/memoria_resolutiva/product_conversation.py .github/workflows/temp-freeze-conversation-response.yml
          git commit -m "fix(native): freeze conversation response metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
