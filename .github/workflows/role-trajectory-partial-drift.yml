name: Role trajectory partial drift

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_trajectory_partial_drift.py'
      - '.github/workflows/role-trajectory-partial-drift.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Run partial drift probe
        env:
          PYTHONPATH: .:src
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          python benchmarks/role_trajectory_partial_drift.py | tee benchmark-results/role-trajectory-partial-drift.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-trajectory-partial-drift
          path: benchmark-results/role-trajectory-partial-drift.json
