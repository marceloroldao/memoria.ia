name: Apply native concept catalog patch

on:
  push:
    branches:
      - experiment/post-v1-native-concept-catalog-apply

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[native-concept-catalog-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-native-concept-catalog-apply
          fetch-depth: 0
      - name: Apply catalog materialization slice
        run: |
          python tools/apply_native_concept_catalog_patch.py
          rm -f tools/apply_native_concept_catalog_patch.py
          rm -f .github/workflows/apply-native-concept-catalog.yml
          git diff --check
          git config user.name "Marcelo Roldão Matos"
          git config user.email "marceloroldao@gmail.com"
          git add -A
          git commit -m "post-v1: materialize authoritative concept catalog in native BDR [native-concept-catalog-applied]"
          git push origin HEAD:experiment/post-v1-native-concept-catalog-apply
