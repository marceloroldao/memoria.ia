name: Role joint self calibration

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_joint_self_calibration.py'
      - 'benchmarks/role_joint_boundary_trajectory_edges.py'
      - 'benchmarks/role_joint_boundary_unseen_domains.py'
      - 'benchmarks/role_joint_boundary_robustness.py'
      - 'benchmarks/role_permutation_cost_matrix.py'
      - '.github/workflows/role-joint-self-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Validate deterministic calibration
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_joint_self_calibration.py | tee benchmark-results/role-joint-self-calibration.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-joint-self-calibration
          path: benchmark-results/role-joint-self-calibration.json
