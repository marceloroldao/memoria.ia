name: Role joint trajectory edges

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_joint_boundary_trajectory_edges.py'
      - 'benchmarks/role_joint_boundary_length_normalized.py'
      - 'benchmarks/role_joint_boundary_robustness.py'
      - 'benchmarks/role_permutation_cost_matrix.py'
      - '.github/workflows/role-joint-trajectory-edges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Validate trajectory edge evidence
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_joint_boundary_trajectory_edges.py | tee benchmark-results/role-joint-trajectory-edges.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-joint-trajectory-edges
          path: benchmark-results/role-joint-trajectory-edges.json
