name: temporary live Gemini validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify Gemini secret
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY is unavailable to this workflow' && exit 1)
      - name: Install product dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product]'
      - name: Validate Gemini through Memoria.ia
        run: python experiments/live_gemini_validation.py
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: live-gemini-validation
          path: benchmark-results/live-gemini-v1.json
          if-no-files-found: error
          retention-days: 30
