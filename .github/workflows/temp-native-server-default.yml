name: temp-native-server-default

on:
  push:
    branches:
      - integration/v1.0-native-server-default
    paths:
      - '.github/workflows/temp-native-server-default.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-server-default
          fetch-depth: 0
      - name: Make native runtime the fail-closed server default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/memoria_resolutiva/product_server.py')
          text = path.read_text()
          text = text.replace('os.getenv("MEMORIA_CONVERSATION_RUNTIME", "python")', 'os.getenv("MEMORIA_CONVERSATION_RUNTIME", "native")')
          text = text.replace('os.getenv("MEMORIA_EPISODIC_RUNTIME", "python")', 'os.getenv("MEMORIA_EPISODIC_RUNTIME", "native")')
          path.write_text(text)
          PY
      - name: Commit server default and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-native-server-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/memoria_resolutiva/product_server.py .github/workflows/temp-native-server-default.yml
          git commit -m "feat(server): make native runtime production default"
          git push origin HEAD:integration/v1.0-native-server-default
