name: publish Memoria.ia v2.0.0-rc1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v2-rc1:
    runs-on: ubuntu-latest
    env:
      V2_RC1_TAG: v2.0.0-rc1
      V2_RC1_PUBLICATION_COMMIT: e239a40ce54f2030cfe25a97f1647143f9b9061c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V2 RC1 package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']['version']
          if version != '2.0.0rc1':
              raise SystemExit(f'expected 2.0.0rc1, found {version}')
          print('V2 RC1 package version verified')
          PY

      - name: Verify release metadata
        run: python scripts/validate_release_metadata.py

      - name: Verify release notes
        run: test -s RELEASE_NOTES_v2.0.0-rc1.md

      - name: Create tag and GitHub pre-release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$V2_RC1_TAG" >/dev/null 2>&1; then
            echo "$V2_RC1_TAG already exists; updating release notes without moving the tag."
            gh release edit "$V2_RC1_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file RELEASE_NOTES_v2.0.0-rc1.md
          else
            gh release create "$V2_RC1_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Memoria.ia v2.0.0-rc1 — Structural Memory Baseline' \
              --notes-file RELEASE_NOTES_v2.0.0-rc1.md \
              --prerelease
          fi

      - name: Verify immutable publication tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA="$(git rev-list -n 1 "$V2_RC1_TAG")"
          test "$TAG_SHA" = "$V2_RC1_PUBLICATION_COMMIT"
          echo "$V2_RC1_TAG remains frozen at $TAG_SHA"
