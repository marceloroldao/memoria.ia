name: temp-resolve-index-trigger

on:
  pull_request:
    branches:
      - integration/v1.0-candidate

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'perf/v1.0-native-resolve-index'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v1.0-native-resolve-index
      - name: Apply patch
        run: python3 tools/apply_resolve_index_patch.py
      - name: Commit patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-resolve-index-patch.yml .github/workflows/temp-resolve-index-trigger.yml tools/apply_resolve_index_patch.py
          git add native/mobile/memoria_mobile.c
          git commit -m "perf(native): index memory ids for lineage lookup"
          git push origin HEAD:perf/v1.0-native-resolve-index
