name: Role trajectory temporal hysteresis

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_trajectory_temporal_hysteresis.py'
      - 'benchmarks/role_trajectory_directional_purity.py'
      - '.github/workflows/role-trajectory-temporal-hysteresis.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Run temporal hysteresis probe
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_trajectory_temporal_hysteresis.py | tee benchmark-results/role-trajectory-temporal-hysteresis.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-trajectory-temporal-hysteresis
          path: benchmark-results/role-trajectory-temporal-hysteresis.json
