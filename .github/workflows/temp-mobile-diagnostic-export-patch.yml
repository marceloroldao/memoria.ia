name: temp-mobile-diagnostic-export-patch

on:
  push:
    branches:
      - integration/v1.0-mobile-diagnostic-export
    paths:
      - '.github/workflows/temp-mobile-diagnostic-export-patch.yml'

permissions:
  contents: write

jobs:
  patch-mobile-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integration/v1.0-mobile-diagnostic-export
          fetch-depth: 0

      - name: Wire diagnostic export into mobile runtime
        run: python3 .github/scripts/temp_patch_mobile_diagnostic_export.py

      - name: Commit runtime wiring
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/memoria_mobile.c
          git diff --cached --check
          git commit -m "feat(mobile): wire diagnostic snapshot export"
          git push origin HEAD:integration/v1.0-mobile-diagnostic-export
