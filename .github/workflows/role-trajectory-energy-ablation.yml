name: Role trajectory energy ablation

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_trajectory_energy_ablation.py'
      - 'benchmarks/role_joint_self_calibration.py'
      - 'benchmarks/role_joint_boundary_trajectory_edges.py'
      - '.github/workflows/role-trajectory-energy-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Compare direction-only vs joint
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_trajectory_energy_ablation.py | tee benchmark-results/role-trajectory-energy-ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-trajectory-energy-ablation
          path: benchmark-results/role-trajectory-energy-ablation.json
