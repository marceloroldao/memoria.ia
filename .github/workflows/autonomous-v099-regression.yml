name: autonomous v0.99 adaptive pruning regression

on:
  push:
    branches:
      - experiment/core-autonomous-v099
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v0.98 baseline gate
        run: python -m pytest -q tests/test_autonomous_memory_v098.py tests/test_product_chat_autonomous_v098.py tests/test_autonomous_upgrade_v098.py
      - name: v0.99 adaptive pruning gate
        run: python -m pytest -q tests/test_autonomous_memory_v099.py
      - name: v0.98 vs v0.99 total-latency benchmark
        run: python experiments/autonomous_v099_scaling.py
