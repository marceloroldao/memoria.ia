name: temporary live OpenAI validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_LIVE_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify OpenAI secret
        run: |
          test -n "$OPENAI_API_KEY" || (echo 'OPENAI_API_KEY is unavailable to this workflow' && exit 1)
      - name: Install product dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product]'
      - name: Validate OpenAI through Memoria.ia
        run: python experiments/live_openai_validation.py
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: live-openai-validation
          path: benchmark-results/live-openai-v1.json
          if-no-files-found: error
          retention-days: 30
