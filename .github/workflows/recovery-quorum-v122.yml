name: recovery quorum v1.22 regression

on:
  push:
    branches:
      - experiment/recovery-quorum-v122
  pull_request:
    branches:
      - experiment/structural-inference-v111

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e . pytest
      - name: Full regression
        run: pytest -q
      - name: v1.21 key compromise recovery baseline
        run: pytest -q tests/test_key_compromise_recovery_v121.py
      - name: v1.22 recovery quorum gate
        run: pytest -q tests/test_recovery_quorum_v122.py
