name: recovery quorum v1.22 regression

on:
  push:
    branches:
      - experiment/recovery-quorum-v122
      - experiment/guardian-independence-v123
  pull_request:
    branches:
      - experiment/structural-inference-v111

jobs:
  regression:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.21 key compromise recovery baseline
        run: python -m pytest -q tests/test_key_compromise_recovery_v121.py
      - name: v1.22 recovery quorum gate
        run: python -m pytest -q tests/test_recovery_quorum_v122.py
      - name: v1.23 guardian independence gate
        if: github.ref_name == 'experiment/guardian-independence-v123' || github.head_ref == 'experiment/guardian-independence-v123'
        run: python -m pytest -q tests/test_guardian_independence_v123.py
