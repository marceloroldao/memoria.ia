name: temp-native-provenance-lineage

on:
  push:
    branches: [integration/v1.0-native-provenance-lineage]
    paths: ['.github/workflows/temp-native-provenance-lineage.yml']

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-provenance-lineage
          fetch-depth: 0
      - name: Apply lineage persistence/runtime patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ----- persistence -----
          path = Path('native/mobile/mobile_persistence_bdr.c')
          s = path.read_text()
          s = s.replace('#define MAX_OPS 64', '#define MAX_OPS 128')
          start = s.index('static int save_turn_impl(')
          end = s.index('int memoria_persistence_load_turn(', start)
          save_block = r'''static int save_turn_impl(memoria_persistence *p, size_t slot,
                          unsigned long sequence, const memoria_persist_turn *t,
                          const size_t *superseded_slots, size_t superseded_count,
                          const char *superseded_by_memory_id) {
    bdr_atomic_c_operation ops[MAX_OPS];
    char keys[MAX_OPS][KEY_CAP];
    char vals[24][VAL_CAP];
    char relation_ids[MEMORIA_PERSIST_MAX_RELATIONS][MEMORIA_PERSIST_MEMORY_ID_CAP];
    bdr_atomic_c_batch_result result = {0};
    size_t n = 0, i;
    if (!p || !slot || !t || !t->memory_id || !t->namespace_id || !t->text || !t->role ||
        !t->source_type || !t->ultimate_source_memory_id ||
        t->relation_count > MEMORIA_PERSIST_MAX_RELATIONS ||
        t->parent_count > MEMORIA_PERSIST_MAX_PARENTS ||
        (superseded_count && (!superseded_slots || !superseded_by_memory_id || !*superseded_by_memory_id))) return 0;
    snprintf(vals[0], VAL_CAP, "%u", MEMORIA_MOBILE_STATE_SCHEMA);
    snprintf(vals[1], VAL_CAP, "%zu", slot);
    snprintf(vals[2], VAL_CAP, "%lu", sequence);
    snprintf(vals[3], VAL_CAP, "%.17g", t->authority);
    snprintf(vals[4], VAL_CAP, "%ld", t->order);
    snprintf(vals[5], VAL_CAP, "%zu", t->relation_count);
    snprintf(vals[6], VAL_CAP, "%d", t->superseded ? 1 : 0);
    snprintf(vals[7], VAL_CAP, "%zu", t->parent_count);
    if (!add_meta(p,ops,keys,&n,"schema",vals[0]) ||
        !add_meta(p,ops,keys,&n,"turn_count",vals[1]) ||
        !add_meta(p,ops,keys,&n,"sequence",vals[2]) ||
        !add_put(p,ops,keys,&n,"turn",slot,"memory_id",t->memory_id) ||
        !add_put(p,ops,keys,&n,"turn",slot,"namespace",t->namespace_id) ||
        !add_put(p,ops,keys,&n,"turn",slot,"text",t->text) ||
        !add_put(p,ops,keys,&n,"turn",slot,"role",t->role) ||
        !add_put(p,ops,keys,&n,"turn",slot,"source_type",t->source_type) ||
        !add_put(p,ops,keys,&n,"turn",slot,"ultimate_source_memory_id",t->ultimate_source_memory_id) ||
        !add_put(p,ops,keys,&n,"turn",slot,"authority",vals[3]) ||
        !add_put(p,ops,keys,&n,"turn",slot,"order",vals[4]) ||
        !add_put(p,ops,keys,&n,"turn",slot,"relation_count",vals[5]) ||
        !add_put(p,ops,keys,&n,"turn",slot,"superseded",vals[6]) ||
        !add_put(p,ops,keys,&n,"turn",slot,"created_time",t->created_time) ||
        !add_put(p,ops,keys,&n,"turn",slot,"superseded_by",t->superseded_by) ||
        !add_put(p,ops,keys,&n,"turn",slot,"parent_count",vals[7])) return 0;
    for (i = 0; i < t->parent_count; ++i) {
        char field[64];
        if (!t->parent_memory_ids[i][0]) return 0;
        snprintf(field,sizeof(field),"parent/%zu",i);
        if (!add_put(p,ops,keys,&n,"turn",slot,field,t->parent_memory_ids[i])) return 0;
    }
    for (i = 0; i < t->relation_count; ++i) {
        char field[64];
        const char *relation_id = t->relation_memory_ids[i];
        snprintf(field,sizeof(field),"relation/%zu/subject",i);
        if (!add_put(p,ops,keys,&n,"turn",slot,field,t->relations[i].subject)) return 0;
        snprintf(field,sizeof(field),"relation/%zu/predicate",i);
        if (!add_put(p,ops,keys,&n,"turn",slot,field,t->relations[i].predicate)) return 0;
        snprintf(field,sizeof(field),"relation/%zu/object",i);
        if (!add_put(p,ops,keys,&n,"turn",slot,field,t->relations[i].object)) return 0;
        if (!relation_id[0]) {
            int written = snprintf(relation_ids[i], sizeof(relation_ids[i]), "%s#relation:%zu", t->memory_id, i);
            if (written < 0 || (size_t)written >= sizeof(relation_ids[i])) return 0;
            relation_id = relation_ids[i];
        }
        snprintf(field,sizeof(field),"relation/%zu/memory_id",i);
        if (!add_put(p,ops,keys,&n,"turn",slot,field,relation_id)) return 0;
        snprintf(vals[8+i],VAL_CAP,"%.17g",t->relations[i].confidence);
        snprintf(field,sizeof(field),"relation/%zu/confidence",i);
        if (!add_put(p,ops,keys,&n,"turn",slot,field,vals[8+i])) return 0;
    }
    for (i = 0; i < superseded_count; ++i) {
        if (!superseded_slots[i] || superseded_slots[i] >= slot) return 0;
        if (!add_put(p,ops,keys,&n,"turn",superseded_slots[i],"superseded","1") ||
            !add_put(p,ops,keys,&n,"turn",superseded_slots[i],"superseded_by",superseded_by_memory_id)) return 0;
    }
    return bdr_atomic_c_write_batch(p->db,ops,n,&result) == BDR_ATOMIC_C_OK &&
           result.durable == 1 && result.operations == n;
}

int memoria_persistence_save_turn(memoria_persistence *p, size_t slot,
                                  unsigned long sequence, const memoria_persist_turn *t) {
    return save_turn_impl(p, slot, sequence, t, NULL, 0, NULL);
}

int memoria_persistence_save_turn_with_supersessions(
    memoria_persistence *p, size_t slot, unsigned long sequence,
    const memoria_persist_turn *t, const size_t *superseded_slots, size_t superseded_count,
    const char *superseded_by_memory_id
) {
    return save_turn_impl(p, slot, sequence, t, superseded_slots, superseded_count, superseded_by_memory_id);
}

'''
          s = s[:start] + save_block + s[end:]
          start = s.index('int memoria_persistence_load_turn(')
          end = s.index('int memoria_persistence_save_episode(', start)
          load_block = r'''int memoria_persistence_load_turn(memoria_persistence *p, size_t slot, memoria_persist_turn *t) {
    char *v = NULL;
    unsigned long rc = 0, pc = 0;
    size_t i;
    if (!p || !slot || !t) return 0;
    memset(t,0,sizeof(*t));
    if (!fetch(p,"turn",slot,"memory_id",&t->memory_id) || !t->memory_id) goto fail;
    if (!fetch(p,"turn",slot,"namespace",&t->namespace_id)) goto fail;
    if (!t->namespace_id) {
        t->namespace_id = sdup("");
        if (!t->namespace_id) goto fail;
    }
    if (!fetch(p,"turn",slot,"text",&t->text) || !t->text ||
        !fetch(p,"turn",slot,"role",&t->role) || !t->role ||
        !fetch(p,"turn",slot,"source_type",&t->source_type) || !t->source_type ||
        !fetch(p,"turn",slot,"ultimate_source_memory_id",&t->ultimate_source_memory_id) || !t->ultimate_source_memory_id ||
        !fetch(p,"turn",slot,"authority",&v) || !v || !parse_d(v,&t->authority)) goto fail;
    free(v); v=NULL;
    if (!fetch(p,"turn",slot,"order",&v) || !v || !parse_l(v,&t->order)) goto fail;
    free(v); v=NULL;
    if (!fetch(p,"turn",slot,"superseded",&v)) goto fail;
    if (v) {
        long sup = 0;
        if (!parse_l(v,&sup)) goto fail;
        t->superseded = sup != 0;
        free(v); v=NULL;
    }
    if (!fetch(p,"turn",slot,"created_time",&v)) goto fail;
    if (v) {
        if (strlen(v) >= sizeof(t->created_time)) goto fail;
        snprintf(t->created_time,sizeof(t->created_time),"%s",v); free(v); v=NULL;
    }
    if (!fetch(p,"turn",slot,"superseded_by",&v)) goto fail;
    if (v) {
        if (strlen(v) >= sizeof(t->superseded_by)) goto fail;
        snprintf(t->superseded_by,sizeof(t->superseded_by),"%s",v); free(v); v=NULL;
    }
    if (!fetch(p,"turn",slot,"parent_count",&v)) goto fail;
    if (v) {
        if (!parse_ul(v,&pc) || pc > MEMORIA_PERSIST_MAX_PARENTS) goto fail;
        free(v); v=NULL;
    }
    t->parent_count=(size_t)pc;
    for (i=0;i<t->parent_count;++i) {
        char field[64];
        snprintf(field,sizeof(field),"parent/%zu",i);
        if(!fetch(p,"turn",slot,field,&v)||!v||!*v) goto fail;
        if(strlen(v)>=sizeof(t->parent_memory_ids[i])) goto fail;
        snprintf(t->parent_memory_ids[i],sizeof(t->parent_memory_ids[i]),"%s",v); free(v); v=NULL;
    }
    if (!fetch(p,"turn",slot,"relation_count",&v) || !v || !parse_ul(v,&rc) || rc > MEMORIA_PERSIST_MAX_RELATIONS) goto fail;
    free(v); v=NULL;
    t->relation_count=(size_t)rc;
    for (i=0;i<t->relation_count;++i) {
        char field[64];
        snprintf(field,sizeof(field),"relation/%zu/subject",i);
        if(!fetch(p,"turn",slot,field,&v)||!v) goto fail;
        snprintf(t->relations[i].subject,sizeof(t->relations[i].subject),"%s",v); free(v); v=NULL;
        snprintf(field,sizeof(field),"relation/%zu/predicate",i);
        if(!fetch(p,"turn",slot,field,&v)||!v) goto fail;
        snprintf(t->relations[i].predicate,sizeof(t->relations[i].predicate),"%s",v); free(v); v=NULL;
        snprintf(field,sizeof(field),"relation/%zu/object",i);
        if(!fetch(p,"turn",slot,field,&v)||!v) goto fail;
        snprintf(t->relations[i].object,sizeof(t->relations[i].object),"%s",v); free(v); v=NULL;
        snprintf(field,sizeof(field),"relation/%zu/confidence",i);
        if(!fetch(p,"turn",slot,field,&v)||!v||!parse_d(v,&t->relations[i].confidence)) goto fail;
        free(v); v=NULL;
        snprintf(field,sizeof(field),"relation/%zu/memory_id",i);
        if(!fetch(p,"turn",slot,field,&v)) goto fail;
        if (v && *v) {
            if (strlen(v) >= sizeof(t->relation_memory_ids[i])) goto fail;
            snprintf(t->relation_memory_ids[i], sizeof(t->relation_memory_ids[i]), "%s", v);
            free(v); v=NULL;
        } else {
            int written;
            free(v); v=NULL;
            written = snprintf(t->relation_memory_ids[i], sizeof(t->relation_memory_ids[i]), "%s#relation:%zu", t->memory_id, i);
            if (written < 0 || (size_t)written >= sizeof(t->relation_memory_ids[i])) goto fail;
        }
    }
    return 1;
fail:
    free(v); memoria_persistence_free_turn(t); return 0;
}

'''
          s = s[:start] + load_block + s[end:]
          path.write_text(s)

          # ----- mobile runtime -----
          path = Path('native/mobile/memoria_mobile.c')
          s = path.read_text()
          s = s.replace('#define MAX_CORRECTIONS 16u', '#define MAX_CORRECTIONS 16u\n#define MAX_PARENTS MEMORIA_PERSIST_MAX_PARENTS')
          marker = 'static int turn_relations_to_json(const turn_row *turn, char *out, size_t out_size) {'
          idx = s.index(marker)
          lineage = r'''typedef struct lineage_root {
    const char *memory_id;
    const char *source_type;
    double authority;
    long order;
    const char *created_time;
} lineage_root;

typedef struct memory_ref {
    turn_row *turn;
    int relation_index;
} memory_ref;

static int find_memory_ref(memoria_mobile_handle *h, const char *memory_id, const char *namespace_id, memory_ref *out) {
    size_t i, j;
    if (!h || !memory_id || !out) return 0;
    for (i = 0; i < h->turn_count; ++i) {
        turn_row *turn = &h->turns[i];
        if (!turn_namespace_matches(turn, namespace_id)) continue;
        if (turn->memory_id && strcmp(turn->memory_id, memory_id) == 0) {
            out->turn = turn; out->relation_index = -1; return 1;
        }
        for (j = 0; j < turn->relation_count; ++j) if (turn->relation_memory_ids[j][0] && strcmp(turn->relation_memory_ids[j], memory_id) == 0) {
            out->turn = turn; out->relation_index = (int)j; return 1;
        }
    }
    return 0;
}

static int traceable_source_type(const char *source_type) {
    return source_type && (
        strcmp(source_type,"derived_relation") == 0 ||
        strcmp(source_type,"retrieved_replay") == 0 ||
        strcmp(source_type,"assistant_generated") == 0
    );
}

static int better_root(const lineage_root *candidate, const lineage_root *best, int found) {
    if (!found) return 1;
    if (candidate->authority > best->authority + 1e-12) return 1;
    if (candidate->authority < best->authority - 1e-12) return 0;
    if (candidate->order > best->order) return 1;
    if (candidate->order < best->order) return 0;
    return strcmp(candidate->memory_id,best->memory_id) < 0;
}

static int active_lineage_root(memoria_mobile_handle *h, const char *memory_id, const char *namespace_id, lineage_root *out) {
    const char *queue[128];
    const char *seen[128];
    size_t head = 0, tail = 0, seen_count = 0, i;
    lineage_root best = {0};
    int found = 0;
    if (!h || !memory_id || !*memory_id || !out) return 0;
    queue[tail++] = memory_id;
    while (head < tail) {
        const char *current = queue[head++];
        memory_ref ref = {0};
        int duplicate = 0;
        for (i = 0; i < seen_count; ++i) if (strcmp(seen[i],current) == 0) { duplicate = 1; break; }
        if (duplicate) continue;
        if (seen_count >= 128) return 0;
        seen[seen_count++] = current;
        if (!find_memory_ref(h,current,namespace_id,&ref)) continue;
        if (ref.relation_index >= 0) {
            if (tail >= 128) return 0;
            queue[tail++] = ref.turn->memory_id;
            continue;
        }
        if (ref.turn->superseded || ref.turn->superseded_by[0]) continue;
        if (traceable_source_type(ref.turn->source_type) && ref.turn->parent_count) {
            for (i = 0; i < ref.turn->parent_count; ++i) {
                if (tail >= 128) return 0;
                queue[tail++] = ref.turn->parent_memory_ids[i];
            }
            continue;
        }
        if (traceable_source_type(ref.turn->source_type) && !ref.turn->parent_count &&
            ref.turn->ultimate_source_memory_id && *ref.turn->ultimate_source_memory_id &&
            strcmp(ref.turn->ultimate_source_memory_id,ref.turn->memory_id) != 0) {
            if (tail >= 128) return 0;
            queue[tail++] = ref.turn->ultimate_source_memory_id;
            continue;
        }
        {
            lineage_root candidate = {
                ref.turn->memory_id,
                ref.turn->source_type,
                ref.turn->authority,
                ref.turn->order,
                ref.turn->created_time
            };
            if (better_root(&candidate,&best,found)) { best = candidate; found = 1; }
        }
    }
    if (!found) return 0;
    *out = best;
    return 1;
}

'''
          s = s[:idx] + lineage + s[idx:]
          old = '''static int turn_factual_active(memoria_mobile_handle *h, const turn_row *turn) {\n    turn_row *root;\n    if (!h || !turn || turn->superseded) return 0;\n    if (!turn->ultimate_source_memory_id || !*turn->ultimate_source_memory_id) return 1;\n    root = find_turn_in_namespace(h, turn->ultimate_source_memory_id, turn->namespace_id);\n    if (root && root->superseded) return 0;\n    return 1;\n}\n'''
          new = '''static int turn_factual_active(memoria_mobile_handle *h, const turn_row *turn) {\n    lineage_root root;\n    if (!h || !turn || !turn->memory_id) return 0;\n    return active_lineage_root(h, turn->memory_id, turn->namespace_id, &root);\n}\n'''
          if old not in s: raise SystemExit('turn_factual_active marker missing')
          s = s.replace(old,new,1)

          start = s.index('memoria_mobile_status memoria_mobile_learn_turn_json(')
          end = s.index('memoria_mobile_status memoria_mobile_resolve_context_json(', start)
          learn = r'''memoria_mobile_status memoria_mobile_learn_turn_json(memoria_mobile_handle *h, memoria_mobile_buffer req, memoria_mobile_buffer *out) {
    char *json, *text, *role, *id, *namespace_id, *source_type, *root, *created_time;
    char *corrections[MAX_CORRECTIONS] = {0};
    char *parents[MAX_PARENTS] = {0};
    char *relation_ids[MAX_RELATIONS_PER_TURN] = {0};
    const char *relation_id_ptrs[MAX_RELATIONS_PER_TURN] = {0};
    size_t correction_slots[MAX_CORRECTIONS] = {0};
    char idbuf[64], relations_json[4096];
    turn_row candidate;
    size_t correction_count = 0, parent_count = 0, relation_id_count = 0, i, unique_count = 0;
    int relation_ids_present = 0;
    long order;
    double authority;
    unsigned long next_sequence;
    memoria_mobile_status response_status;
    if (!h || !req.data || !req.size || !out) return MEMORIA_MOBILE_INVALID_ARGUMENT;
    if (h->turn_count >= MAX_TURNS) return unresolved(out, "native turn capacity reached");
    memset(&candidate, 0, sizeof(candidate));
    json = buffer_to_string(req);
    if (!json) return MEMORIA_MOBILE_INTERNAL_ERROR;
    text = json_string(json, "text");
    role = json_string(json, "role");
    id = json_string(json, "memory_id");
    namespace_id = json_string(json, "namespace");
    if (!namespace_id) namespace_id = dup_string("");
    source_type = json_string(json, "source_type");
    root = json_string(json, "ultimate_source_memory_id");
    created_time = json_string(json, "timestamp");
    if (!created_time) created_time = dup_string("");
    correction_count = json_string_array(json, "corrects_memory_ids", corrections, MAX_CORRECTIONS);
    parent_count = json_string_array(json, "parent_memory_ids", parents, MAX_PARENTS);
    order = json_long(json, "order", (long)h->turn_count + 1);
    authority = json_double(json, "source_authority", -1.0);
    if (!text || !role || !namespace_id || !created_time || (correction_count && strcmp(role, "user") != 0)) {
        free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
        free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
        return MEMORIA_MOBILE_INVALID_ARGUMENT;
    }
    next_sequence = h->sequence;
    if (!id) {
        ++next_sequence;
        snprintf(idbuf, sizeof(idbuf), "mobile:%lu", next_sequence);
        id = dup_string(idbuf);
    }
    if (!source_type) {
        if (correction_count) source_type = dup_string("user_correction");
        else source_type = dup_string(strcmp(role, "user") == 0 ? "user_assertion" : "assistant_generated");
    }
    if (authority < 0.0)
        authority = (strcmp(source_type, "user_assertion") == 0 || strcmp(source_type, "user_correction") == 0) ? 1.0 : 0.35;
    if (!id || !source_type) {
        free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
        free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
        return MEMORIA_MOBILE_INTERNAL_ERROR;
    }
    /* Explicit parents must already exist in the same namespace. */
    for (i = 0; i < parent_count; ++i) {
        memory_ref ref = {0};
        size_t k;
        if (!parents[i] || !*parents[i] || strlen(parents[i]) >= MEMORIA_PERSIST_MEMORY_ID_CAP ||
            !find_memory_ref(h,parents[i],namespace_id,&ref)) {
            free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
            free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
            return MEMORIA_MOBILE_INVALID_ARGUMENT;
        }
        for (k = 0; k < candidate.parent_count; ++k) if (strcmp(candidate.parent_memory_ids[k],parents[i]) == 0) break;
        if (k == candidate.parent_count) {
            if (candidate.parent_count >= MAX_PARENTS) {
                free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
                free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
                return MEMORIA_MOBILE_INVALID_ARGUMENT;
            }
            snprintf(candidate.parent_memory_ids[candidate.parent_count++],MEMORIA_PERSIST_MEMORY_ID_CAP,"%s",parents[i]);
        }
    }
    for (i = 0; i < correction_count; ++i) {
        size_t j, k;
        turn_row *prior = find_turn_in_namespace(h, corrections[i], namespace_id);
        if (!prior) {
            free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
            free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
            return MEMORIA_MOBILE_INVALID_ARGUMENT;
        }
        for (j = 0; j < h->turn_count && &h->turns[j] != prior; ++j) {}
        if (j == h->turn_count) {
            free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
            free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
            return MEMORIA_MOBILE_INTERNAL_ERROR;
        }
        for (k = 0; k < unique_count; ++k) if (correction_slots[k] == j + 1u) break;
        if (k == unique_count) correction_slots[unique_count++] = j + 1u;
        for (k = 0; k < candidate.parent_count; ++k) if (strcmp(candidate.parent_memory_ids[k],corrections[i]) == 0) break;
        if (k == candidate.parent_count) {
            if (candidate.parent_count >= MAX_PARENTS) {
                free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
                free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
                return MEMORIA_MOBILE_INVALID_ARGUMENT;
            }
            snprintf(candidate.parent_memory_ids[candidate.parent_count++],MEMORIA_PERSIST_MEMORY_ID_CAP,"%s",corrections[i]);
        }
    }
    if (traceable_source_type(source_type) && candidate.parent_count) {
        lineage_root derived = {0};
        lineage_root best = {0};
        int found = 0;
        for (i = 0; i < candidate.parent_count; ++i) if (active_lineage_root(h,candidate.parent_memory_ids[i],namespace_id,&derived)) {
            if (better_root(&derived,&best,found)) { best=derived; found=1; }
        }
        free(root); root = dup_string(found ? best.memory_id : candidate.parent_memory_ids[0]);
    } else if (!root) {
        root = dup_string(id);
    }
    if (!root || strlen(created_time) >= sizeof(candidate.created_time)) {
        free_string_array(parents,parent_count); free_string_array(corrections, correction_count);
        free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root); free(created_time);
        return MEMORIA_MOBILE_INVALID_ARGUMENT;
    }
    candidate.memory_id = id;
    candidate.namespace_id = namespace_id;
    candidate.text = text;
    candidate.role = role;
    candidate.source_type = source_type;
    candidate.ultimate_source_memory_id = root;
    candidate.authority = authority;
    candidate.order = order;
    candidate.superseded = 0;
    snprintf(candidate.created_time,sizeof(candidate.created_time),"%s",created_time);
    candidate.relation_count = memoria_extract_relations(text, candidate.relations, MAX_RELATIONS_PER_TURN);
    relation_ids_present = strstr(json, "\"relation_memory_ids\"") != NULL;
    if (relation_ids_present)
        relation_id_count = json_string_array(json, "relation_memory_ids", relation_ids, MAX_RELATIONS_PER_TURN);
    if (relation_ids_present && relation_id_count != candidate.relation_count) {
        free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);
        free_string_array(corrections, correction_count); free(created_time);
        free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;
    }
    for (i = 0; i < candidate.relation_count; ++i) {
        int written;
        if (relation_ids_present) {
            if (!relation_ids[i] || !relation_ids[i][0] || strlen(relation_ids[i]) >= sizeof(candidate.relation_memory_ids[i])) {
                free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);
                free_string_array(corrections, correction_count); free(created_time);
                free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;
            }
            snprintf(candidate.relation_memory_ids[i], sizeof(candidate.relation_memory_ids[i]), "%s", relation_ids[i]);
        } else {
            written = snprintf(candidate.relation_memory_ids[i], sizeof(candidate.relation_memory_ids[i]), "%s#relation:%zu", id, i);
            if (written < 0 || (size_t)written >= sizeof(candidate.relation_memory_ids[i])) {
                free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);
                free_string_array(corrections, correction_count); free(created_time);
                free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;
            }
        }
        relation_id_ptrs[i] = candidate.relation_memory_ids[i];
    }
    if (!memoria_relations_to_json_with_ids(candidate.relations, relation_id_ptrs, candidate.relation_count, id, relations_json, sizeof(relations_json))) {
        free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);
        free_string_array(corrections, correction_count); free(created_time);
        free(json); free_turn(&candidate); return MEMORIA_MOBILE_INTERNAL_ERROR;
    }
    if (!memoria_persistence_save_turn_with_supersessions(
            h->persistence, h->turn_count + 1, next_sequence, &candidate,
            correction_slots, unique_count, candidate.memory_id)) {
        free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);
        free_string_array(corrections, correction_count); free(created_time);
        free(json); free_turn(&candidate); return MEMORIA_MOBILE_PERSISTENCE_ERROR;
    }
    for (i = 0; i < unique_count; ++i) {
        turn_row *prior = &h->turns[correction_slots[i] - 1u];
        prior->superseded = 1;
        snprintf(prior->superseded_by,sizeof(prior->superseded_by),"%s",candidate.memory_id);
    }
    h->turns[h->turn_count++] = candidate;
    h->sequence = next_sequence;
    response_status = set_responsef(out, MEMORIA_MOBILE_OK,
             "{\"status\":\"OK\",\"stored_memory_ids\":[\"%s\"],\"relations\":%s,\"unresolved\":%s,\"native_relation_extraction\":true,\"durable\":true,\"correction_applied\":%s,\"parent_count\":%lu}",
             id, relations_json, candidate.relation_count ? "false" : "true", unique_count ? "true" : "false",
             (unsigned long)candidate.parent_count);
    free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);
    free_string_array(corrections, correction_count); free(created_time);
    free(json);
    return response_status;
}

