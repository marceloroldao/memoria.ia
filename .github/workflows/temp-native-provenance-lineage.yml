          s = s[:start] + learn + s[end:]
          old_sources = '''    for (i = 0; i < h->turn_count; ++i) {\n        if (!turn_namespace_matches(&h->turns[i], namespace_id) || !turn_factual_active(h, &h->turns[i])) continue;\n        sources[source_count].memory_id = h->turns[i].memory_id;\n        sources[source_count].text = h->turns[i].text;\n        sources[source_count].authority = h->turns[i].authority;\n        sources[source_count].order = h->turns[i].order;\n        sources[source_count].source_type = h->turns[i].source_type;\n        sources[source_count].ultimate_source_memory_id = h->turns[i].ultimate_source_memory_id;\n        ++source_count;\n    }\n'''
          new_sources = '''    for (i = 0; i < h->turn_count; ++i) {\n        lineage_root lineage = {0};\n        if (!turn_namespace_matches(&h->turns[i], namespace_id) ||\n            !active_lineage_root(h,h->turns[i].memory_id,namespace_id,&lineage)) continue;\n        sources[source_count].memory_id = h->turns[i].memory_id;\n        sources[source_count].text = h->turns[i].text;\n        sources[source_count].authority = lineage.authority;\n        sources[source_count].order = h->turns[i].order;\n        sources[source_count].source_type = lineage.source_type;\n        sources[source_count].ultimate_source_memory_id = lineage.memory_id;\n        ++source_count;\n    }\n'''
          if old_sources not in s: raise SystemExit('source block missing')
          s = s.replace(old_sources,new_sources,1)
          path.write_text(s)

          # ----- diagnostic export -----
          path = Path('native/mobile/diagnostic_export.c')
          s = path.read_text()
          start = s.index('static int append_turn(')
          end = s.index('static int append_episode(', start)
          append_turn = r'''static int append_turn(json_builder *b, const memoria_persist_turn *t) {
    size_t i;
    if (!append(b, "{\"memory_id\":")) return 0;
    if (!append_json_string(b, t->memory_id)) return 0;
    if (!append(b, ",\"role\":")) return 0;
    if (!append_json_string(b, t->role)) return 0;
    if (!append(b, ",\"text\":")) return 0;
    if (!append_json_string(b, t->text)) return 0;
    if (!append(b, ",\"source_type\":")) return 0;
    if (!append_json_string(b, t->source_type)) return 0;
    if (!append(b, ",\"ultimate_source_memory_id\":")) return 0;
    if (!append_json_string(b, t->ultimate_source_memory_id)) return 0;
    if (!appendf(b, ",\"source_authority\":%.6f,\"order\":%ld,\"superseded\":%s,\"namespace\":", t->authority, t->order, t->superseded ? "true" : "false")) return 0;
    if (!append_json_string(b, t->namespace_id)) return 0;
    if (!append(b, ",\"created_time\":")) return 0;
    if (!append_json_string(b, t->created_time)) return 0;
    if (!append(b, ",\"superseded_by\":")) return 0;
    if (t->superseded_by[0]) { if (!append_json_string(b,t->superseded_by)) return 0; }
    else if (!append(b,"null")) return 0;
    if (!append(b, ",\"parent_memory_ids\":[")) return 0;
    for (i = 0; i < t->parent_count; ++i) {
        if (i && !append(b, ",")) return 0;
        if (!append_json_string(b,t->parent_memory_ids[i])) return 0;
    }
    if (!append(b, "],\"relations\":[")) return 0;
    for (i = 0; i < t->relation_count; ++i) {
        if (i && !append(b, ",")) return 0;
        if (!append_relation(b, &t->relations[i], t->relation_memory_ids[i], t->memory_id)) return 0;
    }
    return append(b, "]}");
}

