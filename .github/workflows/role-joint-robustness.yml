name: Role joint boundary robustness

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_joint_boundary_robustness.py'
      - 'benchmarks/role_joint_boundary_lodo.py'
      - 'benchmarks/role_joint_cost_direction_boundary.py'
      - 'benchmarks/role_permutation_cost_matrix.py'
      - 'benchmarks/role_directional_relation_matrix.py'
      - '.github/workflows/role-joint-robustness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Run robustness matrix
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_joint_boundary_robustness.py | tee benchmark-results/role-joint-boundary-robustness.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-joint-boundary-robustness
          path: benchmark-results/role-joint-boundary-robustness.json
