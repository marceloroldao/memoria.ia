name: controller transfer quorum v1.25 regression

on:
  pull_request:
    branches:
      - experiment/structural-inference-v111
      - experiment/controller-transfer-quorum-v125
  workflow_dispatch:

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.24 controller transfer baseline
        run: python -m pytest -q tests/test_controller_transfer_v124.py
      - name: v1.25 controller transfer quorum gate
        run: python -m pytest -q tests/test_controller_transfer_quorum_v125.py
      - name: v1.26 controller transfer revocation gate
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/controller-transfer-revocation-v126'
        run: python -m pytest -q tests/test_controller_transfer_revocation_v126.py
