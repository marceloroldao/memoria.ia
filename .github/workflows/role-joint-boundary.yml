name: Role joint cost-direction boundary

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_joint_cost_direction_boundary.py'
      - 'benchmarks/role_permutation_cost_matrix.py'
      - 'benchmarks/role_directional_relation_matrix.py'
      - 'src/memoria_resolutiva/role_structural_router_v96.py'
      - '.github/workflows/role-joint-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Search joint boundary
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_joint_cost_direction_boundary.py | tee benchmark-results/role-joint-cost-direction-boundary.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-joint-cost-direction-boundary
          path: benchmark-results/role-joint-cost-direction-boundary.json
