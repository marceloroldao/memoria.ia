name: v1 candidate BDR integration

on:
  pull_request:
    branches:
      - integration/v1.0-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-bdr-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-regression:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q

  linux-native-bdr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Checkout exact Resolutive-DB v1.1.0
        run: |
          git clone --depth 1 --branch v1.1.0 https://github.com/marceloroldao/resolutive-DB.git bdr-v110-src
          test "$(git -C bdr-v110-src describe --tags --exact-match)" = "v1.1.0"
      - name: Build BDR v1.1.0 PIC library
        run: |
          cmake -S bdr-v110-src -B bdr-v110-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build bdr-v110-build --config Release --target bdr_v1_candidate -j2
      - name: Build/install Memoria.ia direct BDR binding
        env:
          MEMORIA_BUILD_BDR: '1'
          BDR_INCLUDE_DIR: ${{ github.workspace }}/bdr-v110-src/experimental/api_v86/include
          BDR_LIBRARY_FILE: ${{ github.workspace }}/bdr-v110-build/experimental/api_v86/libbdr.a
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools>=68' 'pybind11>=2.13,<3'
          python -m pip install --no-build-isolation -e '.[product,test]'
      - name: BDR equivalence and atomicity gates
        run: python -m pytest -q tests/test_bdr_store.py tests/test_bdr_v11_atomic.py tests/test_storage_backend_v1_candidate.py tests/test_sqlite_store.py
      - name: Full regression with BDR extension loaded
        run: python -m pytest -q
