name: v2 address trajectory runtime

on:
  push:
    branches:
      - experiment/address-trajectory-v2
    paths:
      - 'src/memoria_resolutiva/address_trajectory_v2.py'
      - 'src/memoria_resolutiva/address_trajectory_conversation_v2.py'
      - 'src/memoria_resolutiva/persistent_address_trajectory_v2.py'
      - 'src/memoria_resolutiva/native_resolve.py'
      - 'src/memoria_resolutiva/product_persistence.py'
      - 'tests/test_address_trajectory_v2.py'
      - 'tests/test_address_trajectory_conversation_v2.py'
      - 'tests/test_persistent_address_trajectory_v2.py'
      - 'tests/test_native_resolve.py'
      - '.github/workflows/v2-address-trajectory-runtime.yml'
  pull_request:
    paths:
      - 'src/memoria_resolutiva/address_trajectory_v2.py'
      - 'src/memoria_resolutiva/address_trajectory_conversation_v2.py'
      - 'src/memoria_resolutiva/persistent_address_trajectory_v2.py'
      - 'src/memoria_resolutiva/native_resolve.py'
      - 'src/memoria_resolutiva/product_persistence.py'
      - 'tests/test_address_trajectory_v2.py'
      - 'tests/test_address_trajectory_conversation_v2.py'
      - 'tests/test_persistent_address_trajectory_v2.py'
      - '.github/workflows/v2-address-trajectory-runtime.yml'
  workflow_dispatch:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install product and test dependencies
        run: python -m pip install -e '.[product,test]'
      - name: Run V2 address trajectory runtime gate
        run: python -m pytest -q tests/test_address_trajectory_v2.py tests/test_address_trajectory_conversation_v2.py tests/test_persistent_address_trajectory_v2.py tests/test_native_resolve.py
