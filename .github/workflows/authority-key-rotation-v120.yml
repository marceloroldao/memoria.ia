name: authority key rotation v1.20 regression

on:
  push:
    branches:
      - experiment/authority-key-rotation-v120
  pull_request:
    branches:
      - experiment/structural-inference-v111

jobs:
  regression:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.19 attestation lifecycle baseline
        run: python -m pytest -q tests/test_attestation_lifecycle_v119.py
      - name: v1.20 authority key rotation gate
        run: python -m pytest -q tests/test_authority_key_rotation_v120.py
