name: temp-native-turn-namespace

on:
  push:
    branches:
      - integration/v1.0-native-turn-namespace
    paths:
      - '.github/workflows/temp-native-turn-namespace.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-turn-namespace
      - name: Apply persistent namespace patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Persistence: namespace is additive in schema v1; old rows load as default namespace.
          p = Path('native/mobile/mobile_persistence_bdr.c')
          text = p.read_text()
          text = text.replace(
              '''    if (!p || !slot || !t || !t->memory_id || !t->text || !t->role ||
                  !t->source_type || !t->ultimate_source_memory_id ||''',
              '''    if (!p || !slot || !t || !t->memory_id || !t->namespace_id || !t->text || !t->role ||
                  !t->source_type || !t->ultimate_source_memory_id ||''',
              1,
          )
          text = text.replace(
              '''        !add_put(p,ops,keys,&n,"turn",slot,"memory_id",t->memory_id) ||
                  !add_put(p,ops,keys,&n,"turn",slot,"text",t->text) ||''',
              '''        !add_put(p,ops,keys,&n,"turn",slot,"memory_id",t->memory_id) ||
                  !add_put(p,ops,keys,&n,"turn",slot,"namespace",t->namespace_id) ||
                  !add_put(p,ops,keys,&n,"turn",slot,"text",t->text) ||''',
              1,
          )
          old = '''    if (!fetch(p,"turn",slot,"memory_id",&t->memory_id) || !t->memory_id ||
                  !fetch(p,"turn",slot,"text",&t->text) || !t->text ||
                  !fetch(p,"turn",slot,"role",&t->role) || !t->role ||'''
          new = '''    if (!fetch(p,"turn",slot,"memory_id",&t->memory_id) || !t->memory_id) goto fail;
              if (!fetch(p,"turn",slot,"namespace",&t->namespace_id)) goto fail;
              if (!t->namespace_id) {
                  t->namespace_id = sdup("");
                  if (!t->namespace_id) goto fail;
              }
              if (!fetch(p,"turn",slot,"text",&t->text) || !t->text ||
                  !fetch(p,"turn",slot,"role",&t->role) || !t->role ||'''
          if old not in text:
              raise SystemExit('turn load anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''    free(t->memory_id); free(t->text); free(t->role); free(t->source_type); free(t->ultimate_source_memory_id);''',
              '''    free(t->memory_id); free(t->namespace_id); free(t->text); free(t->role); free(t->source_type); free(t->ultimate_source_memory_id);''',
              1,
          )
          p.write_text(text)

          # Runtime: namespace scopes persistent semantic/temporal state. `session_id` remains trajectory-only.
          p = Path('native/mobile/memoria_mobile.c')
          text = p.read_text()
          anchor = '''static turn_row *find_turn(memoria_mobile_handle *h, const char *memory_id) {
              size_t i;
              if (!h || !memory_id) return NULL;
              for (i = 0; i < h->turn_count; ++i) if (h->turns[i].memory_id && strcmp(h->turns[i].memory_id, memory_id) == 0) return &h->turns[i];
              return NULL;
          }
          '''
          replacement = anchor + '''
          static int turn_namespace_matches(const turn_row *turn, const char *namespace_id) {
              const char *stored = turn && turn->namespace_id ? turn->namespace_id : "";
              const char *requested = namespace_id ? namespace_id : "";
              return strcmp(stored, requested) == 0;
          }

          static turn_row *find_turn_in_namespace(memoria_mobile_handle *h, const char *memory_id, const char *namespace_id) {
              size_t i;
              if (!h || !memory_id) return NULL;
              for (i = 0; i < h->turn_count; ++i)
                  if (h->turns[i].memory_id && strcmp(h->turns[i].memory_id, memory_id) == 0 &&
                      turn_namespace_matches(&h->turns[i], namespace_id)) return &h->turns[i];
              return NULL;
          }
          '''
          if anchor not in text:
              raise SystemExit('find_turn anchor not found')
          text = text.replace(anchor, replacement, 1)
          text = text.replace(
              '    root = find_turn(h, turn->ultimate_source_memory_id);',
              '    root = find_turn_in_namespace(h, turn->ultimate_source_memory_id, turn->namespace_id);',
              1,
          )

          text = text.replace(
              'static int temporal_target_from_query(memoria_mobile_handle *h, const char *query, const memoria_relation **target) {',
              'static int temporal_target_from_query(memoria_mobile_handle *h, const char *query, const char *namespace_id, const memoria_relation **target) {',
              1,
          )
          text = text.replace(
              '''        turn_row *turn = &h->turns[i];
                  if (!temporal_turn_eligible(turn)) continue;''',
              '''        turn_row *turn = &h->turns[i];
                  if (!turn_namespace_matches(turn, namespace_id) || !temporal_turn_eligible(turn)) continue;''',
              1,
          )
          text = text.replace(
              '''    const char *query,
              turn_row *fallback_turn,''',
              '''    const char *query,
              const char *namespace_id,
              turn_row *fallback_turn,''',
              1,
          )
          text = text.replace(
              '    target_state = temporal_target_from_query(h, query, &target);',
              '    target_state = temporal_target_from_query(h, query, namespace_id, &target);',
              1,
          )
          text = text.replace(
              '''    for (i = 0; i < h->turn_count; ++i) if (temporal_turn_eligible(&h->turns[i])) {
                  ++source_count;''',
              '''    for (i = 0; i < h->turn_count; ++i) if (turn_namespace_matches(&h->turns[i], namespace_id) && temporal_turn_eligible(&h->turns[i])) {
                  ++source_count;''',
              1,
          )
          # second temporal source loop (first occurrence after source_count reset)
          old = '''    source_count = 0;
              for (i = 0; i < h->turn_count; ++i) {
                  turn_row *turn = &h->turns[i];
                  if (!temporal_turn_eligible(turn)) continue;'''
          new = '''    source_count = 0;
              for (i = 0; i < h->turn_count; ++i) {
                  turn_row *turn = &h->turns[i];
                  if (!turn_namespace_matches(turn, namespace_id) || !temporal_turn_eligible(turn)) continue;'''
          if old not in text:
              raise SystemExit('temporal source loop anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''    current_turn = find_turn(h, state.current_memory_id);
              previous_turn = state.previous_memory_id ? find_turn(h, state.previous_memory_id) : NULL;''',
              '''    current_turn = find_turn_in_namespace(h, state.current_memory_id, namespace_id);
              previous_turn = state.previous_memory_id ? find_turn_in_namespace(h, state.previous_memory_id, namespace_id) : NULL;''',
              1,
          )

          # Learn turn namespace. Default namespace preserves all existing mobile callers.
          text = text.replace(
              '    char *json, *text, *role, *id, *source_type, *root;',
              '    char *json, *text, *role, *id, *namespace_id, *source_type, *root;',
              1,
          )
          text = text.replace(
              '''    id = json_string(json, "memory_id");
              source_type = json_string(json, "source_type");''',
              '''    id = json_string(json, "memory_id");
              namespace_id = json_string(json, "namespace");
              if (!namespace_id) namespace_id = dup_string("");
              source_type = json_string(json, "source_type");''',
              1,
          )
          # Restrict cleanup substitutions to learn function.
          start = text.index('memoria_mobile_status memoria_mobile_learn_turn_json')
          end = text.index('memoria_mobile_status memoria_mobile_resolve_context_json', start)
          learn = text[start:end]
          learn = learn.replace(
              'if (!text || !role || (correction_count && strcmp(role, "user") != 0))',
              'if (!text || !role || !namespace_id || (correction_count && strcmp(role, "user") != 0))',
              1,
          )
          learn = learn.replace(
              'free(json); free(text); free(role); free(id); free(source_type); free(root);',
              'free(json); free(text); free(role); free(id); free(namespace_id); free(source_type); free(root);'
          )
          learn = learn.replace(
              'turn_row *prior = find_turn(h, corrections[i]);',
              'turn_row *prior = find_turn_in_namespace(h, corrections[i], namespace_id);',
              1,
          )
          learn = learn.replace(
              '    candidate.memory_id = id;\n    candidate.text = text;',
              '    candidate.memory_id = id;\n    candidate.namespace_id = namespace_id;\n    candidate.text = text;',
              1,
          )
          text = text[:start] + learn + text[end:]

          # Resolve persistent namespace. The existing JSON `session_id` is untouched for trajectory semantics.
          start = text.index('memoria_mobile_status memoria_mobile_resolve_context_json')
          end = text.index('memoria_mobile_status memoria_mobile_store_episode_json', start)
          resolve = text[start:end]
          resolve = resolve.replace(
              '    char *json, *query, *ctx, *st, *root;',
              '    char *json, *query, *namespace_id, *ctx, *st, *root;',
              1,
          )
          resolve = resolve.replace(
              '''    query = json_string(json, "query");
              if (!query) { free(json); return MEMORIA_MOBILE_INVALID_ARGUMENT; }''',
              '''    query = json_string(json, "query");
              namespace_id = json_string(json, "namespace");
              if (!namespace_id) namespace_id = dup_string("");
              if (!query || !namespace_id) { free(query); free(namespace_id); free(json); return MEMORIA_MOBILE_INVALID_ARGUMENT; }''',
              1,
          )
          resolve = resolve.replace(
              '''    for (i = 0; i < h->turn_count; ++i) {
                  if (!turn_factual_active(h, &h->turns[i])) continue;''',
              '''    for (i = 0; i < h->turn_count; ++i) {
                  if (!turn_namespace_matches(&h->turns[i], namespace_id) || !turn_factual_active(h, &h->turns[i])) continue;''',
              1,
          )
          resolve = resolve.replace(
              'try_temporal_response(h, query, NULL, out, &response_status)',
              'try_temporal_response(h, query, namespace_id, NULL, out, &response_status)',
              1,
          )
          resolve = resolve.replace(
              'turn_row *first_turn = find_turn(h, tr.memory_ids[0]);\n        turn_row *second_turn = find_turn(h, tr.memory_ids[1]);',
              'turn_row *first_turn = find_turn_in_namespace(h, tr.memory_ids[0], namespace_id);\n        turn_row *second_turn = find_turn_in_namespace(h, tr.memory_ids[1], namespace_id);',
              1,
          )
          resolve = resolve.replace(
              'for (i = 0; i < h->turn_count && strcmp(h->turns[i].memory_id, tr.memory_id) != 0; ++i) {}',
              'for (i = 0; i < h->turn_count && (strcmp(h->turns[i].memory_id, tr.memory_id) != 0 || !turn_namespace_matches(&h->turns[i], namespace_id)); ++i) {}',
              1,
          )
          resolve = resolve.replace(
              'for (i = 0; i < h->turn_count && strcmp(h->turns[i].memory_id, r.memory_id) != 0; ++i) {}',
              'for (i = 0; i < h->turn_count && (strcmp(h->turns[i].memory_id, r.memory_id) != 0 || !turn_namespace_matches(&h->turns[i], namespace_id)); ++i) {}',
              1,
          )
          resolve = resolve.replace(
              'try_temporal_response(h, query, &h->turns[i], out, &response_status)',
              'try_temporal_response(h, query, namespace_id, &h->turns[i], out, &response_status)',
              1,
          )
          resolve = resolve.replace('free(query); free(json);', 'free(namespace_id); free(query); free(json);')
          text = text[:start] + resolve + text[end:]
          p.write_text(text)

          # Diagnostic snapshot records persistent turn namespace without disturbing old key ordering assertions.
          p = Path('native/mobile/diagnostic_export.c')
          text = p.read_text()
          old = '''    if (!appendf(b, ",\\\"source_authority\\\":%.6f,\\\"order\\\":%ld,\\\"superseded\\\":%s,\\\"relations\\\":[", t->authority, t->order, t->superseded ? "true" : "false")) return 0;
              for (i = 0; i < t->relation_count; ++i) {'''
          new = '''    if (!appendf(b, ",\\\"source_authority\\\":%.6f,\\\"order\\\":%ld,\\\"superseded\\\":%s,\\\"namespace\\\":", t->authority, t->order, t->superseded ? "true" : "false")) return 0;
              if (!append_json_string(b, t->namespace_id)) return 0;
              if (!append(b, ",\\\"relations\\\":[")) return 0;
              for (i = 0; i < t->relation_count; ++i) {'''
          if old not in text:
              raise SystemExit('diagnostic turn anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Remove one-shot workflow and commit runtime patch
        shell: bash
        run: |
          rm .github/workflows/temp-native-turn-namespace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/mobile/mobile_persistence_bdr.c native/mobile/memoria_mobile.c native/mobile/diagnostic_export.c .github/workflows/temp-native-turn-namespace.yml
          git commit -m 'feat(native): isolate persistent turns by namespace'
          git push origin HEAD:integration/v1.0-native-turn-namespace
