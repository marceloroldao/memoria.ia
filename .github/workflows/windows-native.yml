name: windows-native validation

on:
  push:
    branches:
      - product/windows-native-alpha
    paths:
      - 'install-windows.bat'
      - 'start-memoria.bat'
      - 'docs/WINDOWS_NATIVE.md'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-native.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native installer
        shell: cmd
        run: install-windows.bat
      - name: Configure local alpha
        shell: powershell
        run: |
          @'
          MEMORIA_ORGANIZATION_ID=ci-windows
          MEMORIA_ORGANIZATION_NAME=CI Windows Native
          MEMORIA_NODE_ID=memoria:ci-windows:primary
          MEMORIA_API_KEY=ci-windows-native-key
          MEMORIA_DATA_DIR=/data
          MEMORIA_LLM_PROVIDER=mock
          MEMORIA_LLM_MODEL=
          MEMORIA_LICENSE_STATUS=not_configured
          MEMORIA_LICENSE_PLAN=early_access
          MEMORIA_LICENSE_MAX_NODES=1
          MEMORIA_LICENSE_CAPABILITIES=memory.read,memory.write,chat.use
          '@ | Set-Content -Encoding ascii .env
      - name: Start native server
        shell: powershell
        run: |
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c start-memoria.bat' -PassThru
          $p.Id | Set-Content server.pid
          for ($i=0; $i -lt 30; $i++) {
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/v1/health' -TimeoutSec 2
              if ($health.status -eq 'ok') { exit 0 }
            } catch { Start-Sleep -Seconds 1 }
          }
          throw 'native Windows health endpoint did not become ready'
      - name: Verify web UI
        shell: powershell
        run: |
          $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw 'web UI failed' }
          if ($page.Content -notmatch 'Memoria.ia Enterprise') { throw 'unexpected web UI' }
      - name: Verify native data path
        shell: powershell
        run: |
          if (-not (Test-Path 'data')) { throw 'native data directory missing' }
      - name: Stop native server
        if: always()
        shell: powershell
        run: |
          if (Test-Path server.pid) {
            $pidValue = Get-Content server.pid
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
