name: attestation lifecycle v1.19 regression

on:
  push:
    branches:
      - experiment/attestation-lifecycle-v119
  workflow_dispatch:

concurrency:
  group: attestation-lifecycle-v119-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.18 authority attestation baseline
        run: python -m pytest -q tests/test_authority_attestation_v118.py
      - name: v1.19 attestation lifecycle gate
        run: python -m pytest -q tests/test_attestation_lifecycle_v119.py
