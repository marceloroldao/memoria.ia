name: audit published Memoria.ia v1.0.0-rc5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical-release:
    runs-on: ubuntu-latest
    env:
      HISTORICAL_TAG: v1.0.0-rc5
      HISTORICAL_PUBLICATION_COMMIT: 1efced0caceb00ce16cebcdd98338631d254182d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable historical tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA="$(git rev-list -n 1 "$HISTORICAL_TAG")"
          test "$TAG_SHA" = "$HISTORICAL_PUBLICATION_COMMIT"
          gh release view "$HISTORICAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "$HISTORICAL_TAG remains published at $TAG_SHA"
