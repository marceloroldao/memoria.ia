name: semantic convergence v1.02 regression

on:
  push:
    branches:
      - experiment/semantic-convergence-v102
  workflow_dispatch:

concurrency:
  group: semantic-convergence-v102-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.01 structure baseline
        run: python -m pytest -q tests/test_semantic_structure_v101.py
      - name: v1.02 convergence gate
        run: python -m pytest -q tests/test_semantic_convergence_v102.py
