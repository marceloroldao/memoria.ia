name: Brand raster assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/brand/*.svg'
      - '.github/workflows/brand-raster.yml'

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[brand-raster]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderers
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render PNG and ICO assets
        run: |
          mkdir -p assets/brand/raster
          for size in 512 1024 2048; do
            rsvg-convert -w "$size" -h "$size" assets/brand/symbol-square.svg -o "assets/brand/raster/symbol-${size}.png"
          done
          rsvg-convert -w 1600 assets/brand/logo-horizontal.svg -o assets/brand/raster/logo-horizontal-1600.png
          rsvg-convert -w 1280 -h 640 assets/brand/banner-github.svg -o assets/brand/raster/banner-github-1280x640.png
          rsvg-convert -w 32 -h 32 assets/brand/favicon.svg -o assets/brand/raster/favicon-32.png
          rsvg-convert -w 64 -h 64 assets/brand/favicon.svg -o assets/brand/raster/favicon-64.png
          convert assets/brand/raster/favicon-32.png assets/brand/raster/favicon-64.png assets/brand/raster/favicon.ico
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/raster
          if git diff --cached --quiet; then
            echo 'Raster assets already current.'
          else
            git commit -m 'brand: generate raster assets [brand-raster]'
            git push
          fi
