name: Role trajectory multi-slot drift

on:
  push:
    branches:
      - experiment/bdr-primary-linux
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Run multi-slot drift probe
        shell: bash
        env:
          PYTHONPATH: .:src
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          python benchmarks/role_trajectory_multi_slot_drift.py | tee benchmark-results/role-trajectory-multi-slot-drift.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-trajectory-multi-slot-drift
          path: benchmark-results/role-trajectory-multi-slot-drift.json
