name: trajectory generation proof

on:
  pull_request:
    paths:
      - 'src/memoria_resolutiva/**'
      - 'tests/test_trajectory_generation_v2.py'
      - 'tests/test_structural_association_continuous.py'
      - 'tests/test_structural_trajectory_v2.py'
      - 'scripts/trajectory_generation_gate.py'
      - 'scripts/trajectory_holdout_probe.py'
      - 'scripts/trajectory_episode_probe.py'
      - 'scripts/trajectory_online_probe.py'
      - 'scripts/trajectory_private_replay.py'
      - 'scripts/trajectory_stability_probe.py'
      - 'scripts/trajectory_projection_probe.py'
      - 'scripts/trajectory_interleaved_probe.py'
      - 'scripts/trajectory_incremental_probe.py'
      - 'scripts/trajectory_response_quality_probe.py'
      - 'scripts/trajectory_query_specificity_probe.py'
      - 'tests/test_trajectory_query_specificity_probe.py'
      - 'tests/test_temporal_nodule_contrast.py'
      - 'scripts/trajectory_transition_contrast_probe.py'
      - 'scripts/trajectory_contextual_hypothesis_probe.py'
      - 'tests/test_contextual_route_hypothesis.py'
      - 'tests/test_trajectory_response_quality_probe.py'
      - 'benchmark-results/trajectory-incremental-reference.json'
      - '.github/workflows/trajectory-generation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic generative proof
        run: python scripts/trajectory_generation_gate.py
      - name: Embedded root export adapter without private data
        run: python scripts/trajectory_private_replay.py
      - name: Reused read projection and cold parity
        run: python scripts/trajectory_projection_probe.py
      - name: Interleaved learning and full cold-read parity
        run: |
          python scripts/trajectory_interleaved_probe.py --seed 20260930
          python scripts/trajectory_interleaved_probe.py --seed 20261002
      - name: Incremental occurrence order and pinned pre-change reference
        run: python scripts/trajectory_incremental_probe.py
      - name: Held-out structural scenarios and negative controls
        run: |
          python scripts/trajectory_holdout_probe.py --seed 4107
          python scripts/trajectory_holdout_probe.py --seed 20260927
      - name: Cross-capture episodes and ambiguity
        run: |
          python scripts/trajectory_episode_probe.py --seed 4169
          python scripts/trajectory_episode_probe.py --seed 20260928
          python scripts/trajectory_episode_probe.py --seed 20260929
          python scripts/trajectory_episode_probe.py --seed 9271901
      - name: Online exact-root distraction and negative controls
        run: |
          python scripts/trajectory_online_probe.py --seed 9271902
          python scripts/trajectory_online_probe.py --seed 20260930
      - name: Recurrent route stability without factual selection
        run: |
          python scripts/trajectory_stability_probe.py --seed 9281903
          python scripts/trajectory_stability_probe.py --seed 20261001
      - name: Response scorecard integrity (quality failures reported)
        run: |
          python -m unittest discover -s tests -p test_trajectory_response_quality_probe.py
          python scripts/trajectory_response_quality_probe.py --seed 20260930
          python scripts/trajectory_response_quality_probe.py --seed 20261004
      - name: Query specificity diagnosis and coverage ablation
        run: |
          python -m unittest discover -s tests -p test_trajectory_query_specificity_probe.py
          python scripts/trajectory_query_specificity_probe.py --seed 20260930
          python scripts/trajectory_query_specificity_probe.py --seed 20261004
          python scripts/trajectory_query_specificity_probe.py --seed 20261005
      - name: Temporal source destination contrast without selection policy
        run: |
          python -m unittest discover -s tests -p test_temporal_nodule_contrast.py
          python scripts/trajectory_transition_contrast_probe.py --seed 20260930
          python scripts/trajectory_transition_contrast_probe.py --seed 20261004
          python scripts/trajectory_transition_contrast_probe.py --seed 20261006
      - name: Opt in contextual hypothesis and remaining absence failures
        run: |
          python -m unittest discover -s tests -p test_contextual_route_hypothesis.py
          python scripts/trajectory_contextual_hypothesis_probe.py --seed 20260930
          python scripts/trajectory_contextual_hypothesis_probe.py --seed 20261004
          python scripts/trajectory_contextual_hypothesis_probe.py --seed 20261007
      - name: Install regression runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Existing trajectory consumers and association field
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_structural_trajectory_v2.py
          tests/test_persistent_structural_trajectory_v2.py
          tests/test_structural_association_continuous.py
          tests/test_structural_branch_rollout_recovery_v2.py
          tests/test_hierarchical_multiscale_v2.py
          tests/test_structural_attractor_v2.py
