        run: |
          python -m unittest discover -s tests -p test_trajectory_analogy_two_slot_probe.py
          python scripts/trajectory_analogy_two_slot_probe.py --seed 20261030
          python scripts/trajectory_analogy_two_slot_probe.py --seed 20261031
      - name: Alignment candidate retention and conservative consensus (integrity only)
        run: |
          python -m unittest discover -s tests -p test_trajectory_analogy_alignment_probe.py
