name: semantic structure v1.01 regression

on:
  push:
    branches:
      - experiment/semantic-structure-v101
  workflow_dispatch:

concurrency:
  group: semantic-structure-v101-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.00 retrieval baseline
        run: python -m pytest -q tests/test_autonomous_memory_v100.py tests/test_autonomous_memory_v100_adversarial.py
      - name: v1.01 semantic structure gate
        run: python -m pytest -q tests/test_semantic_structure_v101.py
