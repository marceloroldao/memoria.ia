name: release metadata validation

on:
  push:
    branches:
      - main
    paths:
      - '.zenodo.json'
      - 'CITATION.cff'
      - 'pyproject.toml'
      - 'README.md'
      - 'scripts/validate_release_metadata.py'
      - '.github/workflows/release-metadata.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.zenodo.json'
      - 'CITATION.cff'
      - 'pyproject.toml'
      - 'README.md'
      - 'scripts/validate_release_metadata.py'
      - '.github/workflows/release-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release and Zenodo metadata
        run: python scripts/validate_release_metadata.py
