name: Apply native concept lifecycle patch

on:
  push:
    branches:
      - experiment/post-v1-native-concept-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[concept-lifecycle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-native-concept-lifecycle
          fetch-depth: 0
      - name: Apply lifecycle integration
        run: |
          cat > native/mobile/concept_runtime_state.h <<'EOF'
          #ifndef MEMORIA_CONCEPT_RUNTIME_STATE_H
          #define MEMORIA_CONCEPT_RUNTIME_STATE_H
          
          #include "concept_identity_bdr.h"
          #include "concept_identity_kernel.h"
          #include "concept_identity_state.h"
          
          typedef struct memoria_concept_runtime memoria_concept_runtime;
          
          int memoria_concept_runtime_open(
              const char *data_dir,
              const char *organization_id,
              memoria_concept_runtime **out
          );
          
          const memoria_concept_index *memoria_concept_runtime_index(const memoria_concept_runtime *runtime);
          int memoria_concept_runtime_sync(memoria_concept_runtime *runtime);
          void memoria_concept_runtime_close(memoria_concept_runtime *runtime);
          
          #endif
          EOF
          
          cat > native/mobile/concept_runtime_state.c <<'EOF'
          #include "concept_runtime_state.h"
          
          #include <stdlib.h>
          
          struct memoria_concept_runtime {
              memoria_concept_bdr *store;
              memoria_concept_index index;
          };
          
          int memoria_concept_runtime_open(
              const char *data_dir,
              const char *organization_id,
              memoria_concept_runtime **out
          ) {
              memoria_concept_runtime *runtime;
              memoria_concept_state_row rows[MEMORIA_CONCEPT_MAX_CONCEPTS];
              size_t row_count = 0;
              if (!data_dir || !*data_dir || !organization_id || !*organization_id || !out) return 0;
              *out = NULL;
              runtime = (memoria_concept_runtime *)calloc(1, sizeof(*runtime));
              if (!runtime) return 0;
              memoria_concept_index_init(&runtime->index);
              if (!memoria_concept_bdr_open(data_dir, organization_id, &runtime->store) ||
                  !memoria_concept_bdr_load(runtime->store, rows, MEMORIA_CONCEPT_MAX_CONCEPTS, &row_count) ||
                  memoria_concept_state_import(&runtime->index, rows, row_count) != MEMORIA_CONCEPT_OK) {
                  memoria_concept_runtime_close(runtime);
                  return 0;
              }
              *out = runtime;
              return 1;
          }
          
          const memoria_concept_index *memoria_concept_runtime_index(const memoria_concept_runtime *runtime) {
              return runtime ? &runtime->index : NULL;
          }
          
          int memoria_concept_runtime_sync(memoria_concept_runtime *runtime) {
              return runtime && runtime->store && memoria_concept_bdr_sync(runtime->store);
          }
          
          void memoria_concept_runtime_close(memoria_concept_runtime *runtime) {
              if (!runtime) return;
              memoria_concept_bdr_close(runtime->store);
              free(runtime);
          }
          EOF
          
          cat > native/mobile/tests/concept_runtime_state.c <<'EOF'
          #define _XOPEN_SOURCE 700
          #include "concept_identity_bdr.h"
          #include "concept_identity_kernel.h"
          #include "concept_identity_state.h"
          #include "concept_runtime_state.h"
          #include "memoria_mobile.h"
          #include <assert.h>
          #include <stdlib.h>
          #include <string.h>
          
          static memoria_concept_definition defn(
              const char *id, const char *ns, const char *canonical,
              const char *const *aliases, size_t alias_count
          ) {
              memoria_concept_definition d;
              memset(&d, 0, sizeof(d));
              d.concept_id = id;
              d.namespace_name = ns;
              d.canonical_name = canonical;
              d.aliases = aliases;
              d.alias_count = alias_count;
              return d;
          }
          
          int main(void) {
              char path[] = "/tmp/memoria-concept-runtime-XXXXXX";
              memoria_concept_index seed;
              memoria_concept_state_row rows[MEMORIA_CONCEPT_MAX_CONCEPTS];
              memoria_concept_bdr *store = NULL;
              memoria_concept_runtime *runtime = NULL;
              memoria_mobile_handle *mobile = NULL;
              const memoria_concept_index *index;
              memoria_concept_resolution r;
              size_t row_count = 0;
              const char *aliases[] = {"ddp", "diferença de potencial"};
              memoria_concept_definition voltage = defn(
                  "concept:voltage", "electronics", "voltage", aliases, 2
              );
              assert(mkdtemp(path) != NULL);
              memoria_concept_index_init(&seed);
              assert(memoria_concept_register(&seed, &voltage) == MEMORIA_CONCEPT_OK);
              assert(memoria_concept_state_export(&seed, rows, MEMORIA_CONCEPT_MAX_CONCEPTS, &row_count) == MEMORIA_CONCEPT_OK);
              assert(row_count == 1);
              assert(memoria_concept_bdr_open(path, "org-runtime", &store));
              assert(memoria_concept_bdr_save(store, rows, row_count));
              assert(memoria_concept_bdr_sync(store));
              memoria_concept_bdr_close(store);
              
              assert(memoria_concept_runtime_open(path, "org-runtime", &runtime));
              index = memoria_concept_runtime_index(runtime);
              assert(index != NULL);
              r = memoria_concept_resolve(index, "electronics", "DDP");
              assert(r.status == MEMORIA_CONCEPT_HIT);
              assert(strcmp(r.concept_id, "concept:voltage") == 0);
              memoria_concept_runtime_close(runtime);
              runtime = NULL;
              
              /* The public Native lifecycle must also load the same persisted concept state. */
              assert(memoria_mobile_open(path, "org-runtime", &mobile) == MEMORIA_MOBILE_OK);
              assert(memoria_mobile_flush(mobile) == MEMORIA_MOBILE_OK);
              memoria_mobile_close(mobile);
              mobile = NULL;
              
              assert(memoria_concept_runtime_open(path, "org-runtime", &runtime));
              index = memoria_concept_runtime_index(runtime);
              r = memoria_concept_resolve(index, "electronics", "diferença de potencial");
              assert(r.status == MEMORIA_CONCEPT_HIT);
              assert(strcmp(r.concept_id, "concept:voltage") == 0);
              memoria_concept_runtime_close(runtime);
              return 0;
          }
          EOF
          
          python - <<'PY'
          from pathlib import Path
          p = Path('native/mobile/memoria_mobile.c')
          s = p.read_text()
          reps = [
              ('#include "semantic_consolidation_request.h"\n', '#include "semantic_consolidation_request.h"\n#include "concept_runtime_state.h"\n'),
              ('    memoria_persistence *persistence;\n', '    memoria_persistence *persistence;\n    memoria_concept_runtime *concept_runtime;\n'),
              ('        !memoria_persistence_meta(h->persistence, &turns, &episodes, &sequence) ||\n        episodes > MAX_EPISODES)',
               '        !memoria_persistence_meta(h->persistence, &turns, &episodes, &sequence) ||\n        !memoria_concept_runtime_open(data_dir, organization_id, &h->concept_runtime) ||\n        episodes > MAX_EPISODES)'),
              ('    return memoria_persistence_sync(h->persistence) ? MEMORIA_MOBILE_OK : MEMORIA_MOBILE_PERSISTENCE_ERROR;\n',
               '    return memoria_persistence_sync(h->persistence) && memoria_concept_runtime_sync(h->concept_runtime)\n        ? MEMORIA_MOBILE_OK : MEMORIA_MOBILE_PERSISTENCE_ERROR;\n'),
              ('    memoria_persistence_close(h->persistence);\n', '    memoria_concept_runtime_close(h->concept_runtime);\n    memoria_persistence_close(h->persistence);\n'),
          ]
          for old, new in reps:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one anchor, found {s.count(old)}: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          
          p = Path('native/mobile/CMakeLists.txt')
          s = p.read_text()
          reps = [
              ('  concept_identity_bdr.c\n)', '  concept_identity_bdr.c\n  concept_runtime_state.c\n)'),
              ('set_target_properties(memoria_concept_internal PROPERTIES C_STANDARD 11 C_STANDARD_REQUIRED YES)',
               'set_target_properties(memoria_concept_internal PROPERTIES\n  C_STANDARD 11 C_STANDARD_REQUIRED YES C_VISIBILITY_PRESET hidden\n)'),
              ('target_link_libraries(memoria_mobile PRIVATE bdr_atomic_c_api)',
               'target_link_libraries(memoria_mobile PRIVATE bdr_atomic_c_api memoria_concept_internal)'),
              ('  add_test(NAME memoria_concept_identity_bdr_test COMMAND memoria_concept_identity_bdr_test)\n',
               '  add_test(NAME memoria_concept_identity_bdr_test COMMAND memoria_concept_identity_bdr_test)\n\n  add_executable(memoria_concept_runtime_state_test tests/concept_runtime_state.c)\n  target_link_libraries(memoria_concept_runtime_state_test PRIVATE memoria_mobile memoria_concept_internal)\n  target_include_directories(memoria_concept_runtime_state_test PRIVATE ${CMAKE_CURRENT_LIST_DIR}/../../include ${CMAKE_CURRENT_LIST_DIR})\n  set_target_properties(memoria_concept_runtime_state_test PROPERTIES C_STANDARD 11 C_STANDARD_REQUIRED YES)\n  add_test(NAME memoria_concept_runtime_state_test COMMAND memoria_concept_runtime_state_test)\n')
          ]
          for old, new in reps:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one CMake anchor, found {s.count(old)}: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          
          rm -f .github/workflows/apply-native-concept-lifecycle.yml
          git diff --check
          git status --short
          git config user.name "Marcelo Roldão Matos"
          git config user.email "marceloroldao@gmail.com"
          git add -A
          git commit -m "post-v1: attach persisted concepts to native lifecycle [concept-lifecycle-applied]"
          git push origin HEAD:experiment/post-v1-native-concept-lifecycle
