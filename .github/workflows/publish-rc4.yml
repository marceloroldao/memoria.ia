name: publish Memoria.ia v1.0.0-rc4

on:
  push:
    branches:
      - main
    paths:
      - 'RELEASE_NOTES_v1.0.0-rc4.md'
      - 'pyproject.toml'
      - '.github/workflows/publish-rc4.yml'

permissions:
  contents: write

jobs:
  publish-rc4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RC4 package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']['version']
          if version != '1.0.0rc4':
              raise SystemExit(f'expected 1.0.0rc4, found {version}')
          print('RC4 package version verified')
          PY

      - name: Verify release notes
        run: test -s RELEASE_NOTES_v1.0.0-rc4.md

      - name: Create tag and GitHub pre-release at exact merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0-rc4 >/dev/null 2>&1; then
            echo 'v1.0.0-rc4 release already exists; refusing to republish.'
            exit 0
          fi
          gh release create v1.0.0-rc4 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Memoria.ia v1.0.0-rc4 — Layered Adaptive Memory Candidate' \
            --notes-file RELEASE_NOTES_v1.0.0-rc4.md \
            --prerelease

      - name: Verify tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA="$(git rev-list -n 1 v1.0.0-rc4)"
          test "$TAG_SHA" = "$GITHUB_SHA"
          echo "v1.0.0-rc4 -> $TAG_SHA"
