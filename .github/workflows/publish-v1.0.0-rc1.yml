name: publish v1.0.0-rc1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.0-rc1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'marceloroldao/memoria.ia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate publication metadata
        run: python scripts/validate_release_metadata.py

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 62e76499af896e84fdc0987f116435c6815d9d38
        run: |
          if gh release view v1.0.0-rc1 >/dev/null 2>&1; then
            echo 'v1.0.0-rc1 already exists; publication is idempotent.'
            exit 0
          fi
          gh release create v1.0.0-rc1 \
            --target "$TARGET_SHA" \
            --title 'Memoria.ia v1.0.0-rc1 — Release Candidate 1' \
            --notes-file RELEASE_NOTES_v1.0.0-rc1.md \
            --prerelease
