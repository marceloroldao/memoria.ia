name: Sync v1.0.0-rc1 DOI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-v1.0.0-rc1-doi.yml

permissions:
  contents: write

jobs:
  sync-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Update GitHub release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0-rc1 --notes-file RELEASE_NOTES_v1.0.0-rc1.md
