name: autonomous v0.98 regression

on:
  push:
    branches:
      - experiment/core-autonomous-v098
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v0.97 baseline gate
        run: python -m pytest -q tests/test_autonomous_memory_v097.py tests/test_product_chat_autonomous_v097.py
      - name: v0.98 candidate gate
        run: python -m pytest -q tests/test_autonomous_memory_v098.py
