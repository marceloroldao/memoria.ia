name: Role trajectory direction stress

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_trajectory_direction_stress.py'
      - 'benchmarks/role_joint_self_calibration.py'
      - 'benchmarks/role_joint_boundary_trajectory_edges.py'
      - '.github/workflows/role-trajectory-direction-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Stress direction-only gate
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_trajectory_direction_stress.py | tee benchmark-results/role-trajectory-direction-stress.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-trajectory-direction-stress
          path: benchmark-results/role-trajectory-direction-stress.json
