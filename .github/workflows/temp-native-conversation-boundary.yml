name: temp-native-conversation-boundary
on:
  pull_request:
    branches:
      - integration/v1.0-candidate
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'integration/v1.0-native-conversation-server-adapter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-conversation-server-adapter
          fetch-depth: 0
      - name: Patch relation id boundary and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/mobile/memoria_mobile.c')
          s = p.read_text()
          old = '''    if (relation_ids_present && relation_id_count != candidate.relation_count) {\n        free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);\n        free_string_array(corrections, correction_count); free(created_time);\n        free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;\n    }'''
          new = '''    if (relation_ids_present && relation_id_count < candidate.relation_count) {\n        free_string_array(relation_ids, relation_id_count); free_string_array(parents,parent_count);\n        free_string_array(corrections, correction_count); free(created_time);\n        free(json); free_turn(&candidate); return MEMORIA_MOBILE_INVALID_ARGUMENT;\n    }'''
          if old not in s:
              raise SystemExit('relation id validation anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/temp-native-conversation-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/memoria_mobile.c .github/workflows/temp-native-conversation-boundary.yml
          git commit -m "feat(native): allow bounded prefetched relation ids"
          git push origin integration/v1.0-native-conversation-server-adapter
