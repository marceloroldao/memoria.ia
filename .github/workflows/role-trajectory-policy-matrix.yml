name: Role trajectory policy matrix

on:
  push:
    branches: [experiment/bdr-primary-linux]
    paths:
      - 'benchmarks/role_trajectory_policy_matrix.py'
      - 'benchmarks/role_trajectory_coverage_stress.py'
      - 'benchmarks/role_joint_boundary_trajectory_edges.py'
      - '.github/workflows/role-trajectory-policy-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e '.[product]'
      - name: Validate tri-state policy
        run: |
          mkdir -p benchmark-results
          python benchmarks/role_trajectory_policy_matrix.py | tee benchmark-results/role-trajectory-policy-matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: role-trajectory-policy-matrix
          path: benchmark-results/role-trajectory-policy-matrix.json
