name: authority independence v1.17 regression

on:
  push:
    branches:
      - experiment/authority-independence-v117
  workflow_dispatch:

concurrency:
  group: authority-independence-v117-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: v1.16 adjudication cycle baseline
        run: python -m pytest -q tests/test_adjudication_cycle_guard_v116.py tests/test_source_reliability_v115.py
      - name: v1.17 authority independence gate
        run: python -m pytest -q tests/test_authority_independence_v117.py
