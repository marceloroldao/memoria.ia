name: v0.96 clean protocol validation

on:
  push:
    branches:
      - experiment/v0.96-semantic-routing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and pytest
        run: |
          python -m pip install -e .
          python -m pip install 'pytest>=8'

      - name: Run protocol isolation tests
        run: python -m pytest -q tests/test_v096_training_protocol.py

      - name: Run clean calibration-selected validation
        run: python experiments/clean_calibrated_event_action_v96.py
