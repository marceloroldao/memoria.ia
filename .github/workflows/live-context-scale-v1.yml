name: live context scale v1

on:
  push:
    branches:
      - experiment/live-context-scale-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-context-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, gemini]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_LIVE_MODEL: gpt-5.6-luna
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify provider secret
        shell: bash
        run: |
          if [ "${{ matrix.provider }}" = "openai" ]; then
            test -n "$OPENAI_API_KEY" || (echo 'OPENAI_API_KEY unavailable' && exit 1)
          else
            test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY unavailable' && exit 1)
          fi
      - name: Install product dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product]'
      - name: Run live context scale benchmark
        run: |
          python experiments/live_context_scale_v1.py \
            --provider "${{ matrix.provider }}" \
            --sizes 1000 5000 10000 50000 \
            --output "benchmark-results/live-context-scale-${{ matrix.provider }}-v1.json"
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: live-context-scale-${{ matrix.provider }}-v1
          path: benchmark-results/live-context-scale-${{ matrix.provider }}-v1.json
          if-no-files-found: error
          retention-days: 30
