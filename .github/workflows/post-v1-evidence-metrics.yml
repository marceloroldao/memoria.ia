name: Post-v1 evidence metrics

on:
  push:
    branches:
      - experiment/post-v1-evidence-metrics-separation
  pull_request:
    branches:
      - post-v1/core-base

jobs:
  evidence-metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build evidence metrics test
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Inative/mobile \
            native/mobile/tests/evidence_metrics.c \
            native/mobile/evidence_metrics.c \
            -o /tmp/memoria_evidence_metrics_test
      - name: Run evidence metrics test
        run: /tmp/memoria_evidence_metrics_test
