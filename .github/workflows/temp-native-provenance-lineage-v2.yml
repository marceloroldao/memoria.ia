name: apply-native-provenance-lineage

on:
  push:
    branches:
      - "integration/v1.0-native-provenance-lineage-v2"
    paths:
      - ".github/workflows/temp-native-provenance-lineage-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0-native-provenance-lineage-v2
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_native_provenance_lineage.py
      - name: Commit patched runtime
        shell: bash
        run: |
          rm .github/scripts/apply_native_provenance_lineage.py
          rm .github/workflows/temp-native-provenance-lineage-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/memoria_mobile.c native/mobile/mobile_persistence_bdr.c native/mobile/diagnostic_export.c .github/scripts/apply_native_provenance_lineage.py .github/workflows/temp-native-provenance-lineage-v2.yml
          git commit -m "feat(native): persist and resolve parent provenance lineage"
          git push origin HEAD:integration/v1.0-native-provenance-lineage-v2
