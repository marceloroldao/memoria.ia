name: autonomous v0.97 cross-platform regression

on:
  push:
    branches:
      - product/windows-autonomous-v097
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[product,test]'
      - name: Full regression
        run: python -m pytest -q
      - name: Autonomous core gate
        run: python -m pytest -q tests/test_autonomous_memory_v097.py tests/test_product_chat_autonomous_v097.py
