name: Apply native created-time patch

on:
  push:
    branches:
      - experiment/post-v1-native-created-time

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-native-created-time
      - name: Apply patch
        run: python .github/scripts/apply_native_created_time.py
      - name: Commit patch when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/memoria_mobile.c native/mobile/CMakeLists.txt native/mobile/tests/created_time_mobile.c
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "post-v1: generate native UTC created_time by default"
          git push origin HEAD:experiment/post-v1-native-created-time
