name: one-shot consolidation test link fix
on:
  push:
    branches:
      - experiment/post-v1-native-auto-consolidation
    paths:
      - tools/fix_consolidation_test_link.py
      - .github/workflows/one-shot-fix-consolidation-link.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/post-v1-native-auto-consolidation
      - run: python tools/fix_consolidation_test_link.py
      - run: |
          rm tools/fix_consolidation_test_link.py
          rm .github/workflows/one-shot-fix-consolidation-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/mobile/CMakeLists.txt tools/fix_consolidation_test_link.py .github/workflows/one-shot-fix-consolidation-link.yml
          git commit -m "build: decouple consolidation state test from persistence"
          git push origin HEAD:experiment/post-v1-native-auto-consolidation
