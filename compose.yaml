services:
  memoria:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - memoria-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  memoria-data:
