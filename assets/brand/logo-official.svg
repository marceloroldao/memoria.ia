<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1536" role="img" aria-labelledby="title desc">
  <title id="title">Memoria.ia official logo</title>
  <desc id="desc">Official dark Memoria.ia identity with a blue-to-violet resolutive orbital network, memoria.ia wordmark and technical tagline.</desc>
  <defs>
    <linearGradient id="brand" x1="330" y1="260" x2="1010" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39B8FF"/>
      <stop offset="0.32" stop-color="#2F83FF"/>
      <stop offset="0.68" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.2" stop-color="#F4EFFF"/>
      <stop offset="0.52" stop-color="#A66CFF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#6D3CEB" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1536" height="1536" fill="#050816"/>

  <!-- orbital system -->
  <g transform="translate(0 4)" fill="none" stroke="url(#brand)" stroke-linecap="round">
    <circle cx="765" cy="612" r="76" stroke-width="7" opacity=".98"/>
    <circle cx="765" cy="612" r="142" stroke-width="6" opacity=".97"/>
    <circle cx="765" cy="612" r="207" stroke-width="5.5" opacity=".95"/>
    <circle cx="765" cy="612" r="274" stroke-width="4.5" opacity=".92"/>
    <circle cx="765" cy="612" r="338" stroke-width="3.2" opacity=".88"/>
  </g>

  <!-- central axis -->
  <path d="M765 342V884" stroke="url(#brand)" stroke-width="5" opacity=".9"/>

  <!-- left relational mesh -->
  <g stroke="url(#brand)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M386 562L475 480L542 514L616 395L744 397" stroke-width="6"/>
    <path d="M386 562L476 612L523 676L613 709L705 654" stroke-width="5.5"/>
    <path d="M475 480L476 612L542 514L616 395" stroke-width="5"/>
    <path d="M476 612L523 676L455 736L515 824L620 785" stroke-width="5"/>
    <path d="M515 824L613 709L620 785L705 654" stroke-width="4.5"/>
    <path d="M386 562C375 650 398 741 455 815" stroke-width="3.2" opacity=".9"/>
    <path d="M455 815C530 886 632 922 747 921" stroke-width="3.2" opacity=".9"/>
  </g>

  <!-- left nodes -->
  <g fill="url(#brand)">
    <circle cx="386" cy="562" r="19"/>
    <circle cx="475" cy="480" r="18"/>
    <circle cx="542" cy="514" r="16"/>
    <circle cx="616" cy="395" r="20"/>
    <circle cx="744" cy="397" r="25"/>
    <circle cx="476" cy="612" r="16"/>
    <circle cx="523" cy="676" r="17"/>
    <circle cx="613" cy="709" r="16"/>
    <circle cx="705" cy="654" r="14"/>
    <circle cx="455" cy="736" r="14"/>
    <circle cx="515" cy="824" r="18"/>
    <circle cx="620" cy="785" r="15"/>
  </g>

  <!-- orbit nodes -->
  <g fill="url(#brand)">
    <circle cx="765" cy="470" r="12"/><circle cx="765" cy="405" r="15"/>
    <circle cx="765" cy="338" r="17"/><circle cx="765" cy="884" r="15"/>
    <circle cx="907" cy="612" r="12"/><circle cx="972" cy="612" r="14"/>
    <circle cx="1038" cy="612" r="15"/><circle cx="1103" cy="612" r="12"/>
    <circle cx="861" cy="507" r="11"/><circle cx="933" cy="486" r="10"/>
    <circle cx="985" cy="510" r="9"/><circle cx="1040" cy="553" r="9"/>
    <circle cx="867" cy="711" r="10"/><circle cx="931" cy="742" r="9"/>
    <circle cx="1001" cy="732" r="9"/><circle cx="1058" cy="690" r="8"/>
  </g>

  <!-- particle field: dense near rings, dispersed outward -->
  <g fill="#A56AF8" opacity=".98">
    <circle cx="1127" cy="377" r="5"/><circle cx="1160" cy="392" r="4"/><circle cx="1193" cy="417" r="5"/><circle cx="1224" cy="454" r="6"/>
    <circle cx="1250" cy="500" r="7"/><circle cx="1270" cy="548" r="7"/><circle cx="1282" cy="596" r="8"/><circle cx="1286" cy="648" r="8"/>
    <circle cx="1278" cy="699" r="8"/><circle cx="1260" cy="749" r="7"/><circle cx="1236" cy="792" r="7"/><circle cx="1206" cy="830" r="6"/>
    <circle cx="1172" cy="861" r="6"/><circle cx="1136" cy="887" r="5"/><circle cx="1100" cy="906" r="5"/>
    <circle cx="1092" cy="418" r="4"/><circle cx="1121" cy="444" r="5"/><circle cx="1150" cy="475" r="5"/><circle cx="1173" cy="511" r="6"/>
    <circle cx="1190" cy="552" r="6"/><circle cx="1200" cy="596" r="7"/><circle cx="1202" cy="643" r="7"/><circle cx="1196" cy="686" r="7"/>
    <circle cx="1181" cy="727" r="6"/><circle cx="1159" cy="766" r="6"/><circle cx="1133" cy="798" r="5"/><circle cx="1102" cy="825" r="5"/>
    <circle cx="1065" cy="390" r="3.5"/><circle cx="1084" cy="458" r="4"/><circle cx="1103" cy="530" r="4.5"/><circle cx="1114" cy="690" r="4.5"/>
    <circle cx="1097" cy="757" r="4"/><circle cx="1070" cy="819" r="3.5"/>
  </g>
  <g fill="#8E63F2" opacity=".82">
    <circle cx="1070" cy="337" r="3"/><circle cx="1100" cy="340" r="3.3"/><circle cx="1134" cy="349" r="3"/><circle cx="1168" cy="365" r="3.5"/>
    <circle cx="1202" cy="386" r="4"/><circle cx="1233" cy="414" r="4"/><circle cx="1261" cy="447" r="4.5"/>
    <circle cx="1070" cy="879" r="3"/><circle cx="1102" cy="870" r="3"/><circle cx="1140" cy="851" r="3.5"/>
  </g>

  <!-- core glow -->
  <circle cx="765" cy="612" r="66" fill="url(#core)" filter="url(#glow)" opacity=".72"/>
  <circle cx="765" cy="612" r="36" fill="url(#core)" opacity=".95"/>
  <circle cx="765" cy="612" r="17" fill="#FFFFFF"/>

  <!-- wordmark -->
  <text x="177" y="1088" fill="#FFFFFF" font-family="Inter, Manrope, Arial, sans-serif" font-size="128" font-weight="400" letter-spacing="-4">memoria</text>
  <text x="963" y="1088" fill="#8B5CF6" font-family="Inter, Manrope, Arial, sans-serif" font-size="128" font-weight="400" letter-spacing="-4">.ia</text>

  <!-- tagline -->
  <text x="768" y="1166" text-anchor="middle" fill="#9D9BFF" font-family="Inter, Manrope, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4.6">MEMÓRIA RESOLUTIVA • CONTEXTO INTELIGENTE • O(1) PARA O CONHECIDO</text>
</svg>
