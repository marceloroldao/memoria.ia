[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-resolutiva"
version = "0.95.0"
description = "Experimental resolutive memory with online lifecycle, multitrajectory routing, distributed consensus, and persistence"
requires-python = ">=3.10"
license = {text = "Resolutive Research and Non-Commercial License (RRNCL) v1.0"}
authors = [{name = "Marcelo Roldão Matos"}]

[project.optional-dependencies]
test = ["pytest>=8"]
word2vec = ["gensim>=4.3"]
product = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
