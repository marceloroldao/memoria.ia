[build-system]
requires = ["setuptools>=68", "pybind11>=2.13,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-resolutiva"
version = "1.0.0rc3"
description = "Resolutive Memory research core with an installable PC/server product layer and deterministic post-v1 retrieval/inference runtime"
requires-python = ">=3.10"
license = {text = "Resolutive Research and Non-Commercial License (RRNCL) v1.0"}
authors = [{name = "Marcelo Roldão Matos"}]

[project.optional-dependencies]
test = ["pytest>=8"]
word2vec = ["gensim>=4.3"]
product = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
]

[tool.setuptools.package-data]
memoria_resolutiva = ["webui/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
